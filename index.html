}
function fmtDateBR(iso) {
  if (!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function NewRequest({ go, mobile, onSubmit, user }) {
  const [step, setStep] = useState(0);
  const [data, setData] = useState({
    type:'', title:'', desc:'', priority:'Normal',
    location:'',
    periodoDeData:'', periodoDeHora:'',
    periodoAteData:'', periodoAteHora:'',
    cpf:'', nomeProfissional:'', nomeEmpresa:'', telefone:'',
  });
  const [cpfAutoFill, setCpfAutoFill] = useState(false);
  const [cpfErr, setCpfErr] = useState('');
  const [files, setFiles] = useState([]);
  const [dragOver, setDragOver] = useState(false);
  const fileInputRef = React.useRef(null);

  const ALLOWED_TYPES = ['image/png','image/jpeg','image/jpg','application/pdf'];
  const MAX_SIZE_MB = 25;
  const MAX_FILES = 10;

  const addFiles = (incoming) => {
    const valid = Array.from(incoming).filter(f => {
      if (!ALLOWED_TYPES.includes(f.type)) return false;
      if (f.size > MAX_SIZE_MB * 1024 * 1024) return false;
      return true;
    });
    setFiles(prev => {
      const merged = [...prev];
      for (const f of valid) {
        if (merged.length >= MAX_FILES) break;
        if (!merged.find(x => x.name === f.name && x.size === f.size)) merged.push(f);
      }
      return merged;
    });
  };
  const removeFile = (idx) => setFiles(prev => prev.filter((_,i) => i !== idx));
  const fmtSize = (bytes) => bytes < 1024*1024 ? (bytes/1024).toFixed(0)+'KB' : (bytes/(1024*1024)).toFixed(1)+'MB';

  const steps = [
    { label:'Tipo de serviço' },
    { label:'Detalhes' },
    { label:'Quem e Quando' },
    { label:'Revisão' },
  ];
  const next = () => setStep(s => Math.min(s+1, steps.length-1));
  const prev = () => setStep(s => Math.max(s-1, 0));
  const set  = (k,v) => setData(d => ({...d, [k]:v}));
  const typeLabel = (serviceTypes.find(t=>t.id===data.type)||{}).label||'—';

  const minDate = fmtDateInput(calcMinDate());

  const handleCpf = (raw) => {
    const fmt = maskCpf(raw);
    const digits = fmt.replace(/\D/g,'');
    set('cpf', fmt);
    if (digits.length === 11) {
      if (!validarCPF(digits)) { setCpfErr('CPF inválido. Verifique os dígitos.'); return; }
      setCpfErr('');
      hashPassword(digits).then(h => {
        const prev = (DB?.requests||[]).find(r => r.cpfHash === h);
        if (prev) {
          decryptRequest(prev).then(dec => {
            setData(d => ({ ...d, cpf: fmt, nomeProfissional: dec.nomeProfissional||d.nomeProfissional, telefone: dec.telefone||d.telefone }));
            setCpfAutoFill(true);
            setTimeout(() => setCpfAutoFill(false), 3500);
          });
        }
      });
    } else {
      setCpfErr('');
    }
  };

  // ── Validação de prazo x prioridade ── (hooks sempre no topo, sem condicional)
  const [prioAlertConfirmed, setPrioAlertConfirmed] = useState(false);
  const prevPrioKeyRef = React.useRef('');

  // Valida datas do período
  const periodoAteOk = !data.periodoAteData || (
    data.periodoAteData >= data.periodoDeData &&
    data.periodoAteData <= fmtDateInput(calcMaxDate(new Date(data.periodoDeData || minDate)))
  );

  // ── Validação de prazo a partir do MOMENTO ATUAL do cadastro ──
  // Crítica (SLA 1h): "Período até" não pode ultrapassar agora + 1h
  // Alta    (SLA 8h): "Período até" não pode ultrapassar agora + 8h
  // A comparação é sempre de AGORA até o fim informado, não entre as duas datas.
  const prioAlert = (() => {
    if (!data.periodoAteData) return null;
    if (data.priority !== 'Crítica' && data.priority !== 'Alta') return null;

    const agora = new Date();
    const ateStr = data.periodoAteData + 'T' + (data.periodoAteHora || '23:59') + ':00';
    const ate = new Date(ateStr);
    const horasAteAte = (ate - agora) / (1000 * 60 * 60); // horas de agora até o fim

    // Formata label legível do fim informado
    const [ay, am, ad] = data.periodoAteData.split('-');
    const fimLabel = `${ad}/${am}/${ay}${data.periodoAteHora ? ' às ' + data.periodoAteHora : ''}`;

    if (data.priority === 'Crítica' && horasAteAte > 1) {
      const limiteStr = (() => {
        const lim = new Date(agora.getTime() + 60 * 60 * 1000);
        return lim.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
      })();
      return {
        level: 'err',
        title: '⚠ Prazo incompatível com prioridade Crítica',
        body: `Prioridade Crítica exige atendimento em até 1 hora. O prazo máximo permitido agora é até ${limiteStr} de hoje. A data/hora informada (${fimLabel}) ultrapassa esse limite. Corrija o prazo ou altere a prioridade.`,
        needsConfirm: false,
      };
    }
    if (data.priority === 'Alta' && horasAteAte > 8) {
      const limiteStr = (() => {
        const lim = new Date(agora.getTime() + 8 * 60 * 60 * 1000);
        const [ld, lm, lh, lmin] = [
          String(lim.getDate()).padStart(2,'0'),
          String(lim.getMonth()+1).padStart(2,'0'),
          String(lim.getHours()).padStart(2,'0'),
          String(lim.getMinutes()).padStart(2,'0'),
        ];
        return `${ld}/${lm} às ${lh}:${lmin}`;
      })();
      return {
        level: 'warn',
        title: '⚠ Prazo estendido para prioridade Alta',
        body: `Prioridade Alta exige atendimento em até 8 horas. O prazo máximo seria até ${limiteStr}. A data/hora informada (${fimLabel}) ultrapassa esse limite. Confirme para prosseguir ou ajuste as datas / prioridade.`,
        needsConfirm: true,
      };
    }
    return null;
  })();

  // Reseta confirmação via useEffect quando datas, horas ou prioridade mudam
  const prioKey = data.priority + '|' + data.periodoAteData + '|' + data.periodoAteHora;
  React.useEffect(() => {
    if (prevPrioKeyRef.current && prevPrioKeyRef.current !== prioKey) {
      setPrioAlertConfirmed(false);
    }
    prevPrioKeyRef.current = prioKey;
  }, [prioKey]);

  // Bloqueia avanço se: Crítica fora do prazo (erro) OU Alta fora do prazo não confirmada
  const prioBlock = prioAlert && (prioAlert.level === 'err' || (prioAlert.needsConfirm && !prioAlertConfirmed));

  const step2ok = data.periodoDeData && periodoAteOk && validarCPF(data.cpf.replace(/\D/g,'')) && !cpfErr && data.nomeProfissional && data.telefone && !prioBlock;

  return (
    <div className="main-pad">
      <div className="page-title-row"><div className="page-title"><h2>Nova solicitação</h2><p>Self-service em 4 etapas · status em tempo real</p></div></div>
      <div className="stepper-shell">
        <aside className="stepper-aside">
          <h3>Solicitação</h3><h2>Conte o que precisa</h2>
          <div className="step-list">{steps.map((s,i)=>(
            <div key={i} className={`step-item ${i===step?'active':''} ${i<step?'done':''}`}>
              <div className="step-num">{i<step?<Icon name="check" size={12}/>:i+1}</div>
              <div className="step-label">{s.label}</div>
            </div>
          ))}</div>
          <div className="footer-tip">Roteamento automático · notificações em tempo real · auditoria criptografada.</div>
        </aside>

        <div className="stepper-main">

          {/* ── STEP 0 ── */}
          {step===0 && <div>
            <h3>Que tipo de serviço você precisa?</h3>
            <p className="lead">Selecione a categoria.</p>
            <div className="type-grid">{serviceTypes.map(t=>(
              <button key={t.id} className={`type-card ${data.type===t.id?'selected':''}`} onClick={()=>set('type',t.id)}>
                <div className="ti"><Icon name={t.icon} size={18}/></div>
                <div><div className="tl">{t.label}</div><div className="td">{t.desc}</div></div>
              </button>
            ))}</div>
          </div>}

          {/* ── STEP 1 ── */}
          {step===1 && <div>
            <h3>Detalhes da solicitação</h3>
            <p className="lead">Quanto mais claro, mais rápido a equipe resolve.</p>
            <div className="field"><label>Título <span className="req">*</span></label><input type="text" placeholder="Ex.: Troca de lâmpada queimada na vitrine" value={data.title} onChange={e=>set('title',e.target.value)}/></div>
            <div className="field"><label>Descrição</label><textarea rows={4} placeholder="Descreva o ocorrido..." value={data.desc} onChange={e=>set('desc',e.target.value)}/></div>
            <div className="field"><label>Prioridade percebida</label>
              <div className="priority-row">{['Muito Baixa','Baixa','Normal','Alta','Crítica'].map(p=>(
                <button key={p} data-p={p} className={`priority-card ${data.priority===p?'selected':''}`} onClick={()=>set('priority',p)}>
                  <div className="pl">{p}</div>
                  <div className="ps">{p==='Muito Baixa'?'+ de 7 dias':p==='Baixa'?'até 7 dias':p==='Normal'?'até 48h':p==='Alta'?'até 8h':'até 1h'}</div>
                </button>
              ))}</div>
            </div>
          </div>}

          {/* ── STEP 2 — Quem e Quando ── */}
          {step===2 && <div>
            <h3>Quem e Quando?</h3>
            <p className="lead">Informe o profissional e o período da solicitação.</p>

            {/* Loja/Setor vem do cadastro do usuário */}
            <div style={{ display:"flex", alignItems:"center", gap:10, background:"var(--info-bg)", border:"1px solid rgba(37,99,235,0.25)", borderRadius:8, padding:"10px 14px", marginBottom:18, fontSize:12, color:"var(--info)" }}>
              <Icon name="map-pin" size={14}/>
              <div><strong>Loja / Setor: </strong>{[user.store, user.setor].filter(Boolean).join(" · ") || "Não informado no cadastro"}</div>
            </div>
            {/* Período */}
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
              <div className="field">
                <label>Período de <span className="req">*</span></label>
                <div style={{ display:'flex', gap:6 }}>
                  <input type="date" value={data.periodoDeData} min={minDate}
                    max={fmtDateInput(calcMaxDate(new Date(minDate)))}
                    style={{ flex:2 }}
                    onChange={e=>{
                      set('periodoDeData', e.target.value);
                      // se até < de, limpa até
                      if (data.periodoAteData && data.periodoAteData < e.target.value) set('periodoAteData','');
                    }}/>
                  <TimeSelect value={data.periodoDeHora} onChange={v=>set("periodoDeHora",v)}/>
                </div>
              </div>
              <div className="field">
                <label>Período até</label>
                <div style={{ display:'flex', gap:6 }}>
                  <input type="date" value={data.periodoAteData}
                    min={data.periodoDeData || minDate}
                    max={fmtDateInput(calcMaxDate(new Date(data.periodoDeData || minDate)))}
                    style={{ flex:2 }}
                    onChange={e => {
                      const val = e.target.value;
                      const maxAllowed = fmtDateInput(calcMaxDate(new Date(data.periodoDeData || minDate)));
                      // iOS/Safari ignora max — forçar via JS
                      if (val > maxAllowed) { set('periodoAteData', maxAllowed); }
                      else { set('periodoAteData', val); }
                    }}/>
                  <TimeSelect value={data.periodoAteHora} onChange={v=>set("periodoAteHora",v)}/>
                </div>
                {!periodoAteOk && <div className="hint" style={{ color:'var(--err)' }}>Máximo 15 dias a partir da data de início.</div>}
              </div>
            </div>

            {/* ── Banner de alerta: prioridade x prazo ── */}
            {prioAlert && (
              <div style={{
                display:'flex', flexDirection:'column', gap:8,
                background: prioAlert.level==='err' ? 'var(--err-bg)' : 'var(--warn-bg)',
                border: `1.5px solid ${prioAlert.level==='err' ? 'var(--err)' : 'var(--warn)'}`,
                borderRadius:10, padding:'14px 16px', marginTop:4, marginBottom:4,
                fontSize:13, color: prioAlert.level==='err' ? 'var(--err)' : 'var(--warn)',
              }}>
                <div style={{ fontWeight:700, fontSize:13 }}>{prioAlert.title}</div>
                <div style={{ fontWeight:400, lineHeight:1.6, marginTop:2, color: prioAlert.level==='err' ? '#7f1d1d' : '#78350f' }}>{prioAlert.body}</div>
                {prioAlert.needsConfirm && !prioAlertConfirmed && (
                  <div style={{ marginTop:8, display:'flex', gap:10, alignItems:'center', flexWrap:'wrap' }}>
                    <button className="btn btn-sm" onClick={()=>setPrioAlertConfirmed(true)}
                      style={{ background:'var(--warn)', color:'white', borderColor:'var(--warn)', fontWeight:600 }}>
                      Sim, confirmar mesmo assim
                    </button>
                    <span style={{ fontSize:11, color:'#92400e' }}>Ou ajuste as datas / prioridade acima.</span>
                  </div>
                )}
                {prioAlert.needsConfirm && prioAlertConfirmed && (
                  <div style={{ display:'flex', alignItems:'center', gap:6, marginTop:4, fontWeight:600, color:'var(--ok)', fontSize:12 }}>
                    <Icon name="check-circle" size={14}/> Confirmado — você pode continuar.
                  </div>
                )}
              </div>
            )}

            {/* Dados do profissional */}
            <div style={{ borderTop:'1px solid var(--line)', margin:'18px 0 16px', paddingTop:16 }}>
              <div className="label-eyebrow" style={{ marginBottom:12 }}>DADOS DO PROFISSIONAL</div>
            </div>

            {cpfAutoFill && (
              <div style={{ display:'flex', alignItems:'center', gap:8, background:'var(--ok-bg)', border:'1px solid var(--ok)', borderRadius:8, padding:'8px 12px', marginBottom:14, fontSize:12, color:'var(--ok)' }}>
                <Icon name="check-circle" size={14}/> CPF encontrado — nome e telefone preenchidos automaticamente.
              </div>
            )}

            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
              <div className="field">
                <label>CPF <span className="req">*</span></label>
                <input type="text" placeholder="000.000.000-00" value={data.cpf} onChange={e=>handleCpf(e.target.value)} maxLength={14}
                  style={{ borderColor: cpfErr ? 'var(--err)' : (data.cpf.replace(/\D/g,'').length===11 && !cpfErr ? 'var(--ok)' : undefined) }}/>
                {cpfErr && <div className="hint" style={{color:'var(--err)'}}>⚠ {cpfErr}</div>}
                {!cpfErr && data.cpf.replace(/\D/g,'').length===11 && <div className="hint" style={{color:'var(--ok)'}}>✓ CPF válido</div>}
              </div>
              <div className="field">
                <label>Nome do Profissional <span className="req">*</span></label>
                <input type="text" placeholder="Nome completo" value={data.nomeProfissional} onChange={e=>set('nomeProfissional',e.target.value)}/>
              </div>
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
              <div className="field">
                <label>Nome da Empresa</label>
                <input type="text" placeholder="Razão social ou nome fantasia" value={data.nomeEmpresa} onChange={e=>set('nomeEmpresa',e.target.value)}/>
              </div>
              <div className="field">
                <label>Telefone <span className="req">*</span></label>
                <input type="text" placeholder="(XX) XXXXX-XXXX" value={data.telefone} onChange={e=>set('telefone', maskPhone(e.target.value))} maxLength={15}/>
              </div>
            </div>
          </div>}

          {/* ── STEP 3 ── */}
          {step===3 && <div>
            <h3>Revisão final</h3>
            <p className="lead">Confirme os dados antes de enviar.</p>
            {/* ── Upload de arquivos ── */}
            <input ref={fileInputRef} type="file" multiple
              accept=".png,.jpg,.jpeg,.pdf"
              style={{ display:'none' }}
              onChange={e=>{ addFiles(e.target.files); e.target.value=''; }}/>

            <div className={`upload-zone${dragOver?' upload-zone-active':''}`}
              onClick={()=>fileInputRef.current.click()}
              onDragOver={e=>{ e.preventDefault(); setDragOver(true); }}
              onDragLeave={()=>setDragOver(false)}
              onDrop={e=>{ e.preventDefault(); setDragOver(false); addFiles(e.dataTransfer.files); }}>
              <Icon name="paperclip" size={22} style={{ color: dragOver ? 'var(--navy)' : 'var(--ink-3)' }}/>
              <div className="uh">{dragOver ? 'Solte para anexar' : 'Arraste arquivos ou clique para selecionar'}</div>
              <div className="us">PNG, JPG, PDF · até 25 MB por arquivo · máx. 10 arquivos</div>
            </div>

            {files.length > 0 && (
              <div style={{ marginTop:10, display:'flex', flexDirection:'column', gap:6 }}>
                {files.map((f,i) => (
                  <div key={i} style={{ display:'flex', alignItems:'center', gap:10, background:'var(--surface-2)', border:'1px solid var(--line)', borderRadius:8, padding:'8px 12px', fontSize:12 }}>
                    <Icon name="paperclip" size={14} style={{ color:'var(--ink-3)', flexShrink:0 }}/>
                    <span style={{ flex:1, color:'var(--ink)', fontWeight:500, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{f.name}</span>
                    <span style={{ color:'var(--ink-4)', flexShrink:0 }}>{fmtSize(f.size)}</span>
                    <button onClick={e=>{ e.stopPropagation(); removeFile(i); }}
                      style={{ background:'transparent', border:'none', cursor:'pointer', color:'var(--ink-4)', padding:'2px 4px', borderRadius:4, display:'flex', alignItems:'center' }}
                      title="Remover arquivo">
                      <Icon name="x" size={13}/>
                    </button>
                  </div>
                ))}
              </div>
            )}
            <div className="divider"/>
            <div className="label-eyebrow">SERVIÇO</div>
            <div className="review-row"><span className="k">Tipo</span><span className="v">{typeLabel}</span></div>
            <div className="review-row"><span className="k">Título</span><span className="v">{data.title||'—'}</span></div>
            <div className="review-row"><span className="k">Prioridade</span><span className="v">{data.priority}</span></div>
            <div className="divider"/>
            <div className="label-eyebrow">LOCAL E PERÍODO</div>
            <div className="review-row"><span className="k">Localização</span><span className="v">{[user.store, user.setor].filter(Boolean).join(" · ") || "—"}</span></div>
            <div className="review-row"><span className="k">Período de</span><span className="v">{fmtDateBR(data.periodoDeData)}{data.periodoDeHora ? ' às '+data.periodoDeHora : ''}</span></div>
            <div className="review-row"><span className="k">Período até</span><span className="v">{data.periodoAteData ? fmtDateBR(data.periodoAteData)+(data.periodoAteHora?' às '+data.periodoAteHora:'') : '—'}</span></div>
            <div className="divider"/>
            <div className="label-eyebrow">PROFISSIONAL</div>
            <div className="review-row"><span className="k">CPF</span><span className="v">{data.cpf ? '***.***.***-'+data.cpf.slice(-2) : '—'}</span></div>
            <div className="review-row"><span className="k">Nome</span><span className="v">{data.nomeProfissional||'—'}</span></div>
            <div className="review-row"><span className="k">Empresa</span><span className="v">{data.nomeEmpresa||'—'}</span></div>
            <div className="review-row"><span className="k">Telefone</span><span className="v">{data.telefone||'—'}</span></div>
          </div>}

          <div className="stepper-foot">
            <button className="btn btn-ghost" onClick={step===0?()=>go('home'):prev}><Icon name="arrow-left" size={13}/> {step===0?'Cancelar':'Voltar'}</button>
            {step < steps.length-1
              ? <button className="btn btn-primary" onClick={next}
                  disabled={(step===0&&!data.type)||(step===1&&!data.title)||(step===2&&!step2ok)}>
                  Continuar <Icon name="arrow-right" size={13}/>
                </button>
              : <button className="btn btn-gold" onClick={()=>onSubmit({...data, files})}><Icon name="check" size={13}/> Enviar solicitação</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── MY REQUESTS ── */
function RequestActionModal({ req, action, onConfirm, onClose }) {
  const [obs, setObs] = useState('');
  const isReject = action === 'rejeitar';
  const color  = isReject ? 'var(--err)' : 'var(--ok)';
  const title  = isReject ? '❌ Reprovar solicitação' : action === 'aprovar' ? '✅ Aprovar solicitação' : '➡️ Avançar status';
  const nextStatus = () => {
    if (isReject) return 'Cancelado';
    if (action === 'aprovar') return 'Em andamento';
    const seq = ['Pendente','Aguardando aprovação','Em andamento','Concluído'];
    return seq[Math.min(seq.indexOf(req.status)+1, seq.length-1)];
  };
  const nextProg = s => s==='Pendente'?10:s==='Aguardando aprovação'?25:s==='Em andamento'?70:100;
  const submit = () => {
    if (isReject && !obs.trim()) return;
    const ns = nextStatus();
    onConfirm(req.id, ns, nextProg(ns), obs.trim()||null);
    onClose();
  };
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-card" style={{ maxWidth:460 }}>
        <button className="close-x" onClick={onClose}><Icon name="x" size={16}/></button>
        <h3 style={{ color }}>{title}</h3>
        <div style={{ fontSize:12,color:'var(--ink-3)',marginBottom:16 }}>Solicitação <b>{req.id}</b> — {req.title}</div>
        <div className="divider"/>
        <div style={{ background:'var(--surface-2)',borderRadius:8,padding:'10px 14px',marginBottom:16,fontSize:12 }}>
          <div style={{ display:'flex',justifyContent:'space-between',marginBottom:4 }}>
            <span style={{ color:'var(--ink-3)' }}>Status atual</span><StatusPill status={req.status}/>
          </div>
          <div style={{ display:'flex',justifyContent:'space-between',marginTop:6 }}>
            <span style={{ color:'var(--ink-3)' }}>Novo status</span><StatusPill status={nextStatus()}/>
          </div>
        </div>
        <div className="field">
          <label>{isReject ? <span>Motivo <span className="req">*</span></span> : 'Observação (opcional)'}</label>
          <textarea rows={3} value={obs} onChange={e=>setObs(e.target.value)}
            placeholder={isReject ? 'Informe o motivo da reprovação...' : 'Observação opcional...'}/>
        </div>
        {isReject && !obs.trim() && <div style={{ fontSize:11,color:'var(--err)',marginBottom:8 }}>Motivo obrigatório para reprovar.</div>}
        <div style={{ display:'flex',gap:8,justifyContent:'flex-end',marginTop:8 }}>
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className={isReject ? 'btn btn-danger' : 'btn btn-primary'} onClick={submit} disabled={isReject&&!obs.trim()}>
            {isReject ? <Icon name="x" size={13}/> : <Icon name="check" size={13}/>} {isReject ? 'Reprovar' : action==='aprovar' ? 'Aprovar' : 'Avançar'}
          </button>
        </div>
      </div>
    </div>
  );
}

function MyRequests({ go, mobile, user, onChange, onPersist }) {
  const [filter, setFilter] = useState('Todos');
  const [modal, setModal] = useState(null);
  const [, tick] = useState(0);
  const canApprove = hasPerm(user,'servicos','approve');
  const filters = ['Todos','Pendente','Aguardando aprovação','Em andamento','Concluído','Cancelado'];
  const allReqs = canApprove ? (DB?.requests||[]) : (DB?.requests||[]).filter(r=>r.createdBy===user.id);
  const list = filter==='Todos' ? allReqs : allReqs.filter(r=>r.status===filter);
  const done = s => s==='Concluído'||s==='Cancelado';
  const handleConfirm = async (id, status, progress, obs) => {
    updateRequestStatus(id, status, progress, obs);
    tick(x=>x+1); onChange&&onChange(); onPersist&&(await onPersist());
  };
  return (
    <div className="main-pad">
      <div className="page-title-row">
        <div className="page-title">
          <h2>{canApprove?'Solicitações':'Meus pedidos'}</h2>
          <p>{canApprove?'Gerencie e aprove as solicitações':'Acompanhe em tempo real'}</p>
        </div>
      </div>
      <div style={{ display:'flex',gap:8,marginBottom:16,flexWrap:'wrap' }}>
        {filters.map(f=><button key={f} className={`btn btn-sm ${filter===f?'btn-primary':'btn-ghost'}`} onClick={()=>setFilter(f)}>{f}</button>)}
      </div>
      {list.length===0 && <div className="card" style={{ textAlign:'center',padding:32,color:'var(--ink-3)' }}>Nenhuma solicitação encontrada.</div>}
      {list.map(r=>(
        <div className="req-detail-card" key={r.id}>
          <div className="req-detail-head">
            <div style={{ flex:1,minWidth:0 }}>
              <div className="req-detail-id">{r.id}</div>
              <div className="req-detail-title">{r.title}</div>
              <div className="req-detail-meta">
                <span><Icon name="briefcase" size={11}/> {r.type}</span><span className="dot"/>
                <span><Icon name="user" size={11}/> {r.owner}</span><span className="dot"/>
                <span><Icon name="clock" size={11}/> {relativeTime(r.updated)}</span>
              </div>
            </div>
            <StatusPill status={r.status}/>
          </div>
          <div className={`progress ${r.priority==='Crítica'?'crit':r.status==='Concluído'?'ok':r.status==='Cancelado'?'crit':''}`}>
            <span style={{ width:`${r.status==='Cancelado'?100:r.progress}%`, background:r.status==='Cancelado'?'var(--err)':undefined }}/>
          </div>
          <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:10,gap:12,flexWrap:'wrap' }}>
            <div style={{ fontSize:11,color:'var(--ink-3)' }}>
              Prioridade: <b style={{ color:r.priority==='Crítica'?'var(--err)':'var(--ink)' }}>{r.priority}</b>
              {r.obs && <span style={{ marginLeft:10,fontStyle:'italic' }}>💬 {r.obs}</span>}
            </div>
            {canApprove && !done(r.status) && (
              <div style={{ display:'flex',gap:6 }}>
                {r.status==='Aguardando aprovação' && <>
                  <button className="btn btn-sm btn-danger" onClick={()=>setModal({req:r,action:'rejeitar'})}>
                    <Icon name="x" size={13}/> Reprovar
                  </button>
                  <button className="btn btn-sm btn-primary" onClick={()=>setModal({req:r,action:'aprovar'})}
                    style={{ background:'var(--ok)',borderColor:'var(--ok)' }}>
                    <Icon name="check" size={13}/> Aprovar
                  </button>
                </>}
                {r.status!=='Aguardando aprovação' && (
                  <button className="btn btn-sm btn-ghost" onClick={()=>setModal({req:r,action:'avançar'})}>
                    Avançar <Icon name="arrow-right" size={13}/>
                  </button>
                )}
              </div>
            )}
          </div>
        </div>
      ))}
      {modal && <RequestActionModal req={modal.req} action={modal.action} onConfirm={handleConfirm} onClose={()=>setModal(null)}/>}
    </div>
  );
}

const MODULES = [
  { id:'home',       label:'Início' },
  { id:'feed',       label:'Comunicados' },
  { id:'servicos',   label:'Solicitações' },
  { id:'usuarios',   label:'Usuários' },
  { id:'relatorios', label:'Relatórios' },
  { id:'vagas',      label:'Vagas de Emprego (RH)' },
  { id:'curriculos', label:'Banco de Currículos (RH)' },
  { id:'painel',     label:'Painel de Vagas (Candidatos)' },
  { id:'gis',        label:'GIS · Vendas Diárias' },
];
const ACTIONS = ['view','create','edit','delete','approve'];
const ACTION_LABELS = { view:'Ver', create:'Criar', edit:'Editar', delete:'Excluir', approve:'Aprovar' };

const SETORES_USUARIO = [
  'Administração',
  'Marketing',
  'Segurança',
  'Operações',
  'Manutenção/Facilidades',
  'RH/Financeiro',
  'Comercial/Tecnologia',
];

function UserModal({ user: editUser, currentUser, onSave, onClose }) {
  const isNew = !editUser;
  const [login, setLogin] = useState(editUser?.login||'');
  const [nome, setNome] = useState(editUser?.nome||'');
  const [cargo, setCargo] = useState(editUser?.cargo||'');
  const [store, setStore] = useState(editUser?.store||'');
  const [setor, setSetor] = useState(editUser?.setor||'');
  const [role, setRole] = useState(editUser?.role||'colaborador');
  const [pwd, setPwd] = useState('');
  const [pwd2, setPwd2] = useState('');
  const [permissions, setPermissions] = useState(editUser?.permissions||null);
  const [useCustom, setUseCustom] = useState(!!editUser?.permissions);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  const effectivePerms = useCustom
    ? (permissions || JSON.parse(JSON.stringify(DEFAULT_PERMISSIONS[role]||DEFAULT_PERMISSIONS.colaborador)))
    : JSON.parse(JSON.stringify(DEFAULT_PERMISSIONS[role]||DEFAULT_PERMISSIONS.colaborador));

  const togglePerm = (mod, action) => {
    const base = permissions || JSON.parse(JSON.stringify(DEFAULT_PERMISSIONS[role]||DEFAULT_PERMISSIONS.colaborador));
    const updated = JSON.parse(JSON.stringify(base));
    updated[mod] = updated[mod] || {};
    updated[mod][action] = !updated[mod][action];
    setPermissions(updated);
    setUseCustom(true);
  };

  const submit = async () => {
    if (!login.trim()) { setErr('Informe o login.'); return; }
    if (!nome.trim()) { setErr('Informe o nome.'); return; }
    if (isNew && !pwd) { setErr('Informe a senha.'); return; }
    if (pwd && pwd.length < 4) { setErr('Senha mínimo 4 caracteres.'); return; }
    if (pwd && pwd !== pwd2) { setErr('As senhas não coincidem.'); return; }
    // Check duplicate login
    const dup = (DB?.users||[]).find(u => u.login===login.trim() && u.id!==(editUser?.id));
    if (dup) { setErr('Login já existe.'); return; }
    setBusy(true);
    const hash = pwd ? await hashPassword(pwd) : editUser?.passwordHash;
    const u = {
      id: editUser?.id || ('u_'+Date.now()),
      login: login.trim(),
      nome: nome.trim(),
      cargo: cargo.trim(),
      store: store.trim(),
      setor: setor,
      role,
      passwordHash: hash,
      forcePasswordChange: isNew && true,
      permissions: useCustom ? permissions : null,
    };
    onSave(u);
    setBusy(false);
  };

  return (
    <div className="modal-overlay">
      <div className="modal-card" style={{ maxWidth:580 }}>
        <button className="close-x" onClick={onClose}><Icon name="x" size={16}/></button>
        <h3>{isNew?'➕ Novo Usuário':'✏️ Editar Usuário'}</h3>
        <div style={{ fontSize:12,color:'var(--ink-3)',marginBottom:16 }}>{isNew?'Cadastre um novo colaborador no sistema.':'Altere os dados e permissões do usuário.'}</div>
        <div className="divider"/>
        <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr',gap:12 }}>
          <div className="field"><label>Login <span className="req">*</span></label><input type="text" value={login} onChange={e=>setLogin(e.target.value)} placeholder="ex: joao.silva" autoComplete="off"/></div>
          <div className="field"><label>Nome Completo <span className="req">*</span></label><input type="text" value={nome} onChange={e=>setNome(e.target.value)} placeholder="ex: João da Silva"/></div>
          <div className="field"><label>Cargo</label><input type="text" value={cargo} onChange={e=>setCargo(e.target.value)} placeholder="ex: Atendimento"/></div>
          <div className="field"><label>Loja</label><input type="text" value={store} onChange={e=>setStore(e.target.value)} placeholder="ex: Loja 142"/></div>
          <div className="field"><label>Setor</label>
            <select value={setor} onChange={e=>setSetor(e.target.value)}>
              <option value="">— Selecione o setor —</option>
              {SETORES_USUARIO.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div className="field"><label>Perfil</label>
            <select value={role} onChange={e=>{setRole(e.target.value);setUseCustom(false);setPermissions(null);}}>
              <option value="admin">Administrador</option>
              <option value="gestor">Gestor</option>
              <option value="colaborador">Colaborador</option>
            </select>
          </div>
          <div className="field"><label>{isNew?'Senha':'Nova Senha (deixe vazio para manter)'}</label><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder={isNew?'Mínimo 4 caracteres':'••••••••'} autoComplete="new-password"/></div>
          {pwd && <div className="field"><label>Confirmar Senha</label><input type="password" value={pwd2} onChange={e=>setPwd2(e.target.value)} autoComplete="new-password"/></div>}
        </div>

        <div className="divider"/>
        <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12 }}>
          <div style={{ fontSize:13,fontWeight:600 }}>Permissões por módulo</div>
          <button className="btn btn-ghost btn-sm" onClick={()=>{setUseCustom(!useCustom);if(useCustom)setPermissions(null);}}>
            {useCustom?'↩ Usar padrão do perfil':'✎ Personalizar'}
          </button>
        </div>
        {MODULES.map(mod => (
          <div key={mod.id} style={{ marginBottom:12 }}>
            <div style={{ fontSize:12,fontWeight:600,color:'var(--ink-2)',marginBottom:6 }}>{mod.label}</div>
            <div style={{ display:'flex',gap:8,flexWrap:'wrap' }}>
              {ACTIONS.map(action => {
                const enabled = effectivePerms[mod.id]?.[action];
                return (
                  <label key={action} className="perm-item" style={{ opacity:useCustom?1:0.6,cursor:useCustom?'pointer':'not-allowed' }}>
                    <input type="checkbox" checked={!!enabled} disabled={!useCustom} onChange={()=>useCustom&&togglePerm(mod.id,action)}/>
                    {ACTION_LABELS[action]}
                  </label>
                );
              })}
            </div>
          </div>
        ))}
        {!useCustom && <div style={{ fontSize:11,color:'var(--ink-3)',marginTop:4 }}>Permissões padrão do perfil "{role}". Clique em "Personalizar" para ajustar.</div>}

        {err && <div style={{ color:'var(--err)',fontSize:12,marginTop:12,padding:'8px 12px',background:'var(--err-bg)',borderRadius:8 }}>{err}</div>}
        <div style={{ display:'flex',gap:8,marginTop:20,justifyContent:'flex-end' }}>
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={submit} disabled={busy}><Icon name="check" size={13}/> {busy?'Salvando...':'Salvar usuário'}</button>
        </div>
      </div>
    </div>
  );
}

function ChangePasswordModal({ target, onDone, onClose }) {
  const [pwd, setPwd] = useState('');
  const [pwd2, setPwd2] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if (pwd.length < 4) { setErr('Mínimo 4 caracteres.'); return; }
    if (pwd !== pwd2) { setErr('As senhas não coincidem.'); return; }
    setBusy(true);
    const hash = await hashPassword(pwd);
    const idx = DB.users.findIndex(u=>u.id===target.id);
    if (idx>=0) { DB.users[idx].passwordHash=hash; DB.users[idx].forcePasswordChange=false; }
    onDone();
    setBusy(false);
  };
  return (
    <div className="modal-overlay" style={{ zIndex:2100 }}>
      <div className="modal-card" style={{ maxWidth:380 }}>
        <button className="close-x" onClick={onClose}><Icon name="x" size={16}/></button>
        <h3>🔑 Redefinir Senha</h3>
        <p style={{ fontSize:12,color:'var(--ink-3)',marginBottom:16 }}>Defina uma nova senha para <b>{target.nome}</b>.</p>
        <div className="field"><label>Nova Senha</label><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="Mínimo 4 caracteres"/></div>
        <div className="field"><label>Confirmar</label><input type="password" value={pwd2} onChange={e=>setPwd2(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()}/></div>
        {err && <div style={{ color:'var(--err)',fontSize:12,marginBottom:8 }}>{err}</div>}
        <div style={{ display:'flex',gap:8,justifyContent:'flex-end',marginTop:16 }}>
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={submit} disabled={busy}><Icon name="check" size={13}/> {busy?'Salvando...':'Salvar'}</button>
        </div>
      </div>
    </div>
  );
}

function UsersScreen({ user: currentUser, onPersist, onChange }) {
  const [users, setUsers] = useState(DB?.users||[]);
  const [modalUser, setModalUser] = useState(null); // null=closed, false=new, {..}=edit
  const [pwdTarget, setPwdTarget] = useState(null);
  const [search, setSearch] = useState('');
  const [roleFilter, setRoleFilter] = useState('');

  if (!hasPerm(currentUser,'usuarios','view')) {
    return <div className="main-pad"><div className="card" style={{ textAlign:'center',padding:40,color:'var(--ink-3)' }}><Icon name="shield" size={32} style={{ margin:'0 auto 12px',display:'block' }}/><p>Você não tem permissão para acessar este módulo.</p></div></div>;
  }

  const filtered = users.filter(u => {
    const q = search.toLowerCase();
    const matchQ = !q || u.nome?.toLowerCase().includes(q) || u.login?.toLowerCase().includes(q) || u.cargo?.toLowerCase().includes(q);
    const matchR = !roleFilter || u.role===roleFilter;
    return matchQ && matchR;
  });

  const saveUser = async (u) => {
    const idx = DB.users.findIndex(x=>x.id===u.id);
    if (idx>=0) DB.users[idx]=u; else DB.users.push(u);
    setUsers([...DB.users]);
    setModalUser(null);
    onChange&&onChange();
    await onPersist&&onPersist();
  };

  const deleteUser = async (id) => {
    if (id===currentUser.id) { alert('Você não pode excluir seu próprio usuário.'); return; }
    if (!confirm('Excluir este usuário?')) return;
    DB.users = DB.users.filter(u=>u.id!==id);
    setUsers([...DB.users]);
    onChange&&onChange();
    await onPersist&&onPersist();
  };

  const toggleActive = async (id) => {
    const u = DB.users.find(x=>x.id===id); if(!u) return;
    u.active = u.active===false ? true : false;
    setUsers([...DB.users]);
    onChange&&onChange();
    await onPersist&&onPersist();
  };

  const roleLabel = r => r==='admin'?'Administrador':r==='gestor'?'Gestor':'Colaborador';

  return (
    <div className="main-pad">
      <div className="page-title-row">
        <div className="page-title"><h2>Usuários</h2><p>{users.length} usuário{users.length!==1?'s':''} cadastrado{users.length!==1?'s':''}</p></div>
        {hasPerm(currentUser,'usuarios','create') && <button className="btn btn-gold" onClick={()=>setModalUser(false)}><Icon name="plus" size={13}/> Novo usuário</button>}
      </div>

      {/* Filters */}
      <div style={{ display:'flex',gap:10,marginBottom:16,flexWrap:'wrap',alignItems:'center' }}>
        <div style={{ position:'relative',flex:1,minWidth:200 }}>
          <span style={{ position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--ink-3)' }}><Icon name="search" size={14}/></span>
          <input type="text" placeholder="Buscar por nome, login ou cargo..." value={search} onChange={e=>setSearch(e.target.value)} style={{ paddingLeft:32,height:36,width:'100%',background:'var(--surface)',border:'1px solid var(--line)',borderRadius:8,fontSize:13,color:'var(--ink)',outline:'none',fontFamily:'inherit' }}/>
        </div>
        <select value={roleFilter} onChange={e=>setRoleFilter(e.target.value)} style={{ height:36,padding:'0 12px',background:'var(--surface)',border:'1px solid var(--line)',borderRadius:8,fontSize:13,color:'var(--ink)',outline:'none',fontFamily:'inherit' }}>
          <option value="">Todos os perfis</option>
          <option value="admin">Administrador</option>
          <option value="gestor">Gestor</option>
          <option value="colaborador">Colaborador</option>
        </select>
      </div>

      {/* Table */}
      <div className="card" style={{ padding:0,overflow:'hidden' }}>
        <div style={{ overflowX:'auto' }}>
          <table className="users-table">
            <thead>
              <tr><th>Usuário</th><th>Login</th><th>Cargo / Loja / Setor</th><th>Perfil</th><th>Status</th><th>Ações</th></tr>
            </thead>
            <tbody>
              {filtered.length===0 && <tr><td colSpan={6} style={{ textAlign:'center',padding:32,color:'var(--ink-3)' }}>Nenhum usuário encontrado.</td></tr>}
              {filtered.map(u=>(
                <tr key={u.id}>
                  <td>
                    <div style={{ display:'flex',alignItems:'center',gap:10 }}>
                      <div style={{ width:32,height:32,borderRadius:'50%',background:'var(--navy)',color:'white',fontSize:11,fontWeight:600,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0 }}>
                        {(u.nome||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()}
                      </div>
                      <div>
                        <div style={{ fontWeight:600,fontSize:13 }}>{u.nome||'—'}</div>
                        {u.forcePasswordChange && <span style={{ fontSize:10,color:'var(--warn)',background:'var(--warn-bg)',padding:'1px 6px',borderRadius:4,fontWeight:600 }}>⚠ Troca de senha pendente</span>}
                      </div>
                    </div>
                  </td>
                  <td><code style={{ fontSize:12,background:'var(--surface-2)',padding:'2px 6px',borderRadius:4 }}>{u.login}</code></td>
                  <td><div style={{ fontSize:12 }}>{u.cargo||'—'}</div><div style={{ fontSize:11,color:'var(--ink-3)' }}>{u.store||'—'}{u.setor ? ' · '+u.setor : ''}</div></td>
                  <td><span className={`role-badge ${u.role}`}>{roleLabel(u.role)}</span></td>
                  <td>
                    <button onClick={()=>toggleActive(u.id)} style={{ background:'transparent',border:0,cursor:'pointer',fontSize:11,fontWeight:600,padding:'3px 8px',borderRadius:6,color:u.active===false?'var(--err)':'var(--ok)',background:u.active===false?'var(--err-bg)':'var(--ok-bg)' }}>
                      {u.active===false?'⛔ Inativo':'✅ Ativo'}
                    </button>
                  </td>
                  <td>
                    <div style={{ display:'flex',gap:6 }}>
                      {hasPerm(currentUser,'usuarios','edit') && <button className="btn btn-ghost btn-sm" onClick={()=>setModalUser(u)} title="Editar"><Icon name="edit" size={13}/></button>}
                      {hasPerm(currentUser,'usuarios','edit') && <button className="btn btn-ghost btn-sm" onClick={()=>setPwdTarget(u)} title="Redefinir senha"><Icon name="key" size={13}/></button>}
                      {hasPerm(currentUser,'usuarios','delete') && u.id!==currentUser.id && <button className="btn btn-danger btn-sm" onClick={()=>deleteUser(u.id)} title="Excluir"><Icon name="trash" size={13}/></button>}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Modals */}
      {modalUser !== null && <UserModal user={modalUser||null} currentUser={currentUser} onSave={saveUser} onClose={()=>setModalUser(null)}/>}
      {pwdTarget && <ChangePasswordModal target={pwdTarget} onDone={async()=>{saveDBLocal(DB);onChange&&onChange();await onPersist&&onPersist();setPwdTarget(null);}} onClose={()=>setPwdTarget(null)}/>}
    </div>
  );
}

function CadastrarVagaScreen({ user, onPersist, onChange }) {
  if (!hasPerm(user,'vagas','view')) return <Blocked/>;

  // Stepper steps
  const STEPS = [
    { label:'Cargo & Salário' },
    { label:'Contato' },
    { label:'Prazo & Detalhes' },
    { label:'Revisão' },
  ];
  const [step, setStep] = useState(0);
  const [form, setForm] = useState({
    cargo:'', salario:'', complemento:'', responsavel:'', telefone:'', email:'', instagram:'', facebook:'', disponivelAte:'', detalhes:''
  });
  const [busy, setBusy] = useState(false);
  const [ok, setOk] = useState(false);
  const [vagas, setVagas] = useState([]);
  const [vagasLoading, setVagasLoading] = useState(true);
  const [tab, setTab] = useState('nova'); // 'nova' | 'minhas'

  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  // Carrega e descriptografa vagas do usuário
  useEffect(() => {
    (async () => {
      setVagasLoading(true);
      const all = await decryptAllVagas();
      const mine = hasPerm(user,'vagas','approve')
        ? all
        : all.filter(v => v.createdBy === user.id);
      setVagas(mine);
      setVagasLoading(false);
    })();
  }, [ok]);

  const submit = async () => {
    if (!form.cargo) return;
    setBusy(true);
    await addVaga(form, user);
    await onPersist && onPersist();
    onChange && onChange();
    setOk(true); setBusy(false);
    setStep(0);
    setForm({ cargo:'', salario:'', complemento:'', responsavel:'', telefone:'', email:'', instagram:'', facebook:'', disponivelAte:'', detalhes:'' });
    setTimeout(() => { setOk(false); setTab('minhas'); }, 1800);
  };

  const desativar = async (id) => {
    const v = (DB.vagas||[]).find(x=>x.id===id);
    if (v) { v.ativo = !v.ativo; await onPersist&&onPersist(); onChange&&onChange(); }
    const all = await decryptAllVagas();
    setVagas(hasPerm(user,'vagas','approve') ? all : all.filter(v=>v.createdBy===user.id));
  };

  const excluir = async (id) => {
    if (!confirm('Excluir esta vaga?')) return;
    DB.vagas = (DB.vagas||[]).filter(v=>v.id!==id);
    await onPersist&&onPersist(); onChange&&onChange();
    const all = await decryptAllVagas();
    setVagas(hasPerm(user,'vagas','approve') ? all : all.filter(v=>v.createdBy===user.id));
  };

  return (
    <div className="main-pad">
      <div className="page-title-row">
        <div className="page-title">
          <h2>Painel de Empregos</h2>
          <p>Cadastre e gerencie vagas disponíveis nas lojas do shopping</p>
        </div>
      </div>

      {/* Aviso lojista */}
      <div style={{ background:'#fff3cd',border:'1px solid #ffc107',borderRadius:8,padding:'10px 16px',fontSize:12,color:'#856404',marginBottom:18,textAlign:'center',fontWeight:500 }}>
        🏪 Prezado Lojista, este cadastro é exclusivo para anúncio de vagas para sua loja no Shopping Osasco Plaza.
      </div>

      {/* Tabs */}
      <div style={{ display:'flex',gap:8,marginBottom:20 }}>
        {hasPerm(user,'vagas','create') && <button className={`btn ${tab==='nova'?'btn-primary':'btn-ghost'}`} onClick={()=>setTab('nova')}><Icon name="plus" size={13}/> Nova Vaga</button>}
        <button className={`btn ${tab==='minhas'?'btn-primary':'btn-ghost'}`} onClick={()=>setTab('minhas')}><Icon name="list" size={13}/> {hasPerm(user,'vagas','approve')?'Todas as vagas':'Minhas vagas'}</button>
      </div>

      {/* ── FORMULÁRIO (STEPPER) ── */}
      {tab==='nova' && hasPerm(user,'vagas','create') && (
        <div className="stepper-shell">
          <aside className="stepper-aside">
            <h3>Vaga de Emprego</h3>
            <h2>Inclua uma nova vaga</h2>
            <div className="step-list">
              {STEPS.map((s,i) => (
                <div key={i} className={`step-item ${i===step?'active':''} ${i<step?'done':''}`}>
                  <div className="step-num">{i<step?<Icon name="check" size={12}/>:i+1}</div>
                  <div className="step-label">{s.label}</div>
                </div>
              ))}
            </div>
            <div className="footer-tip">Todos os dados são criptografados com AES-GCM 256-bit antes de serem armazenados.</div>
          </aside>

          <div className="stepper-main">
            {ok && (
              <div style={{ textAlign:'center',padding:40 }}>
                <div style={{ fontSize:48,marginBottom:12 }}>✅</div>
                <div style={{ fontSize:18,fontWeight:600,color:'var(--ok)' }}>Vaga cadastrada com sucesso!</div>
                <p style={{ fontSize:13,color:'var(--ink-3)',marginTop:8 }}>Redirecionando para suas vagas...</p>
              </div>
            )}

            {!ok && step===0 && (
              <div>
                <h3>Cargo & Salário</h3>
                <p className="lead">Selecione o cargo e informe a remuneração.</p>
                <div className="field">
                  <label>Vaga Disponível <span className="req">*</span></label>
                  <select value={form.cargo} onChange={e=>set('cargo',e.target.value)}>
                    <option value="">— Selecione —</option>
                    {CARGOS_VAGA.map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr',gap:12 }}>
                  <div className="field">
                    <label>Salário</label>
                    <input type="text" value={form.salario} onChange={e=>set('salario',e.target.value)} placeholder="Ex: R$ 1.800,00"/>
                  </div>
                  <div className="field">
                    <label>Complemento (Comissões ou Outros)</label>
                    <input type="text" value={form.complemento} onChange={e=>set('complemento',e.target.value)} placeholder="Ex: + comissão"/>
                  </div>
                </div>
              </div>
            )}

            {!ok && step===1 && (
              <div>
                <h3>Dados de Contato</h3>
                <p className="lead">Informe o responsável e os canais de contato da loja.</p>
                <div className="field">
                  <label>Nome do Responsável <span className="req">*</span></label>
                  <input type="text" value={form.responsavel} onChange={e=>set('responsavel',e.target.value)} placeholder="Nome completo"/>
                </div>
                <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr',gap:12 }}>
                  <div className="field">
                    <label>Telefone para Contato</label>
                    <input type="text" value={form.telefone} onChange={e=>set('telefone', maskPhone(e.target.value))} placeholder="(XX) XXXXX-XXXX" maxLength={15}/>
                  </div>
                  <div className="field">
                    <label>E-mail</label>
                    <input type="email" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="contato@loja.com"/>
                  </div>
                  <div className="field">
                    <label><Icon name="sparkle" size={12} style={{ verticalAlign:'middle',marginRight:4 }}/>Instagram</label>
                    <input type="text" value={form.instagram} onChange={e=>set('instagram',e.target.value)} placeholder="@sualojaosasco"/>
                  </div>
                  <div className="field">
                    <label><Icon name="megaphone" size={12} style={{ verticalAlign:'middle',marginRight:4 }}/>Facebook</label>
                    <input type="text" value={form.facebook} onChange={e=>set('facebook',e.target.value)} placeholder="facebook.com/sualojaosasco"/>
                  </div>
                </div>
              </div>
            )}

            {!ok && step===2 && (
              <div>
                <h3>Prazo & Detalhes</h3>
                <p className="lead">Defina a vigência e descreva a vaga.</p>
                <div className="field">
                  <label>Vaga Disponível Até <span className="req">*</span></label>
                  <input type="date" value={form.disponivelAte}
                    min={new Date().toISOString().slice(0,10)}
                    max={(() => { const d = new Date(); d.setDate(d.getDate()+90); return d.toISOString().slice(0,10); })()}
                    onChange={e=>set('disponivelAte',e.target.value)}/>
                  <div className="hint">Data mínima: hoje. Máximo 90 dias a partir de hoje.</div>
                </div>
                <div className="field">
                  <label>Detalhes da Vaga</label>
                  <textarea rows={5} value={form.detalhes} onChange={e=>set('detalhes',e.target.value)} placeholder="Descreva requisitos, horário, benefícios..."/>
                </div>
              </div>
            )}

            {!ok && step===3 && (
              <div>
                <h3>Revisão final</h3>
                <p className="lead">Confirme os dados antes de publicar a vaga.</p>
                <div style={{ background:'var(--gold-soft)',border:'1px solid var(--line-2)',borderRadius:10,padding:16,marginBottom:8 }}>
                  {[
                    ['Cargo',      form.cargo],
                    ['Salário',    form.salario || '—'],
                    ['Complemento',form.complemento || '—'],
                    ['Responsável',form.responsavel || '—'],
                    ['Telefone',   form.telefone || '—'],
                    ['E-mail',     form.email || '—'],
                    ['Instagram',  form.instagram || '—'],
                    ['Facebook',   form.facebook || '—'],
                    ['Disponível até', form.disponivelAte || '—'],
                  ].map(([k,v]) => (
                    <div key={k} className="review-row"><span className="k">{k}</span><span className="v">{v}</span></div>
                  ))}
                  {form.detalhes && <div style={{ marginTop:12,fontSize:12,color:'var(--ink-2)',borderTop:'1px solid var(--line)',paddingTop:10 }}><b>Detalhes:</b><br/>{form.detalhes}</div>}
                </div>
                <div style={{ fontSize:11,color:'var(--ink-3)',display:'flex',alignItems:'center',gap:6,marginTop:8 }}>
                  <Icon name="shield" size={12}/> Todos os dados serão criptografados (AES-GCM 256-bit) antes do armazenamento.
                </div>
              </div>
            )}

            {!ok && (
              <div className="stepper-foot">
                <button className="btn btn-ghost" onClick={step===0?()=>{}:()=>setStep(s=>s-1)}>
                  <Icon name="arrow-left" size={13}/> {step===0?'Cancelar':'Voltar'}
                </button>
                {step < STEPS.length-1
                  ? <button className="btn btn-primary" onClick={()=>setStep(s=>s+1)} disabled={(step===0&&!form.cargo)||(step===1&&!form.responsavel)||(step===2&&!form.disponivelAte)}>
                      Continuar <Icon name="arrow-right" size={13}/>
                    </button>
                  : <button className="btn btn-gold" onClick={submit} disabled={busy}>
                      <Icon name="check" size={13}/> {busy?'Publicando...':'Cadastrar e publicar vaga'}
                    </button>
                }
              </div>
            )}
          </div>
        </div>
      )}

      {/* ── LISTAGEM DE VAGAS ── */}
      {tab==='minhas' && (
        <div>
          {vagasLoading
            ? <div className="card" style={{ textAlign:'center',padding:32,color:'var(--ink-3)' }}>Carregando vagas...</div>
            : vagas.length === 0
              ? <div className="card" style={{ textAlign:'center',padding:40,color:'var(--err)',fontWeight:600 }}>Você não possui vagas cadastradas.</div>
              : (
                <div className="card" style={{ padding:0,overflow:'hidden' }}>
                  <div style={{ overflowX:'auto' }}>
                    <table className="users-table">
                      <thead>
                        <tr>
                          <th>ID</th><th>Cargo</th><th>Salário</th><th>Complemento</th>
                          <th>Publicado em</th><th>Disponível até</th><th>Status</th><th>Ações</th>
                        </tr>
                      </thead>
                      <tbody>
                        {vagas.map(v=>(
                          <tr key={v.id}>
                            <td><code style={{ fontSize:11,background:'var(--surface-2)',padding:'2px 5px',borderRadius:4 }}>{v.id}</code></td>
                            <td style={{ fontWeight:600,fontSize:13 }}>{v.cargo}</td>
                            <td style={{ fontSize:12 }}>{v.salario||'—'}</td>
                            <td style={{ fontSize:12 }}>{v.complemento||'—'}</td>
                            <td style={{ fontSize:11,color:'var(--ink-3)' }}>{new Date(v.createdAt).toLocaleDateString('pt-BR')}</td>
                            <td style={{ fontSize:11,color:'var(--ink-3)' }}>{v.disponivelAte||'—'}</td>
                            <td>
                              <span style={{ fontSize:11,fontWeight:600,padding:'3px 8px',borderRadius:999,background:v.ativo?'var(--ok-bg)':'var(--surface-2)',color:v.ativo?'var(--ok)':'var(--ink-3)' }}>
                                {v.ativo?'✅ Ativa':'⛔ Inativa'}
                              </span>
                            </td>
                            <td>
                              <div style={{ display:'flex',gap:6 }}>
                                {hasPerm(user,'vagas','edit') && (
                                  <button className="btn btn-ghost btn-sm" onClick={()=>desativar(v.id)} title={v.ativo?'Desativar':'Ativar'}>
                                    {v.ativo?<Icon name="x" size={13}/>:<Icon name="check" size={13}/>}
                                  </button>
                                )}
                                {hasPerm(user,'vagas','delete') && (
                                  <button className="btn btn-danger btn-sm" onClick={()=>excluir(v.id)} title="Excluir"><Icon name="trash" size={13}/></button>
                                )}
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )
          }
        </div>
      )}
    </div>
  );
}

function CheckboxGroup({ label, items, selected, onChange }) {
  const toggle = item => onChange(selected.includes(item) ? selected.filter(x=>x!==item) : [...selected,item]);
  return (
    <div style={{ marginBottom:16 }}>
      <div style={{ fontSize:11,fontWeight:600,color:'var(--ink-3)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:8,padding:'4px 0',borderBottom:'1px solid var(--line)' }}>{label}</div>

        {items.map(item=>(
          <label key={item} style={{ display:'flex',alignItems:'center',gap:7,fontSize:12,color:'var(--ink-2)',cursor:'pointer',padding:'3px 0' }}>

function ConsultarCurriculosScreen({ user }) {
  if (!hasPerm(user,'curriculos','view')) return <Blocked/>;

  const [filtros, setFiltros] = useState({
    sexo:'', nacionalidade:'', faixaEtariaDe:'', faixaEtariaAte:'',
    comFoto:'', comCv:'', comLinkedin:'', comFacebook:'', comInstagram:'',
    escolaridades:[], estadoCivil:[], cargos:[],
  });
  const [resultados, setResultados] = useState(null);
  const [buscando, setBuscando] = useState(false);
  const [candidatoSel, setCandidatoSel] = useState(null);

  const setF = (k,v) => setFiltros(f=>({...f,[k]:v}));

  const calcIdade = (nasc) => {
    if (!nasc) return null;
    const hoje = new Date();
    const [ano,mes,dia] = nasc.split('-').map(Number);
    let idade = hoje.getFullYear() - ano;
    if (hoje.getMonth()+1 < mes || (hoje.getMonth()+1 === mes && hoje.getDate() < dia)) idade--;
    return idade;
  };

  const buscar = async () => {
    setBuscando(true);
    await new Promise(r=>setTimeout(r,400));
    /* Usa decryptCv() — descriptografa apenas os campos sensíveis,
       preservando comFoto/comCv/comLinkedin/comFacebook/comInstagram/id/createdAt intactos */
    const raw = DB.curriculos || [];
    const dec = await Promise.all(raw.map(c => decryptCv(c)));

    const res = dec.filter(c => {
      /* Sexo */
      if (filtros.sexo && c.sexo !== filtros.sexo) return false;

      /* Nacionalidade */
      if (filtros.nacionalidade && c.nacionalidade !== filtros.nacionalidade) return false;

      /* Escolaridade */
      if (filtros.escolaridades.length && !filtros.escolaridades.includes(c.escolaridade)) return false;

      /* Estado Civil */
      if (filtros.estadoCivil.length && !filtros.estadoCivil.includes(c.estadoCivil)) return false;

      /* Cargo pretendido — compara contra cargo1, cargo2, cargo3, cargo4 */
      if (filtros.cargos.length) {
        const cargosDoCV = [c.cargo1, c.cargo2, c.cargo3, c.cargo4].filter(Boolean);
        const temAlgum = filtros.cargos.some(fc => cargosDoCV.includes(fc));
        if (!temAlgum) return false;
      }

      /* Foto / CV / Redes — campos NÃO criptografados, comparar diretamente */
      if (filtros.comFoto      && c.comFoto      !== filtros.comFoto)      return false;
      if (filtros.comCv        && c.comCv        !== filtros.comCv)        return false;
      if (filtros.comLinkedin  && c.comLinkedin  !== filtros.comLinkedin)  return false;
      if (filtros.comFacebook  && c.comFacebook  !== filtros.comFacebook)  return false;
      if (filtros.comInstagram && c.comInstagram !== filtros.comInstagram) return false;

      /* Faixa etária */
      if (filtros.faixaEtariaDe || filtros.faixaEtariaAte) {
        const idade = calcIdade(c.dataNascimento);
        if (idade === null) return false;
        if (filtros.faixaEtariaDe && idade < Number(filtros.faixaEtariaDe)) return false;
        if (filtros.faixaEtariaAte && idade > Number(filtros.faixaEtariaAte)) return false;
      }

      return true;
    });
    setResultados(res);
    setBuscando(false);
  };

  const limpar = () => {
    setFiltros({ sexo:'', nacionalidade:'', faixaEtariaDe:'', faixaEtariaAte:'',
      comFoto:'', comCv:'', comLinkedin:'', comFacebook:'', comInstagram:'', escolaridades:[], estadoCivil:[], cargos:[] });
    setResultados(null);
  };

  const faixasEtarias = Array.from({length:53},(_,i)=>i+18);

  return (
    <div className="main-pad">

/* ── Máscaras de input ── */
function maskCep(v) {
  const d = v.replace(/\D/g,'').slice(0,8);
  if (d.length > 5) return d.slice(0,5)+'-'+d.slice(5);
  return d;
}
function maskPhone(v) {
  // Padrão único: (XX) XXXXX-XXXX  (11 dígitos — celular)
  const d = v.replace(/\D/g,'').slice(0,11);
  if (d.length === 0) return '';
  if (d.length <= 2)  return '(' + d;
  if (d.length <= 7)  return '(' + d.slice(0,2) + ') ' + d.slice(2);
  return '(' + d.slice(0,2) + ') ' + d.slice(2,7) + '-' + d.slice(7);
}
function maskCpf(v) {
  const d = v.replace(/\D/g,'').slice(0,11);
  if (d.length <= 3) return d;
  if (d.length <= 6) return d.slice(0,3) + '.' + d.slice(3);
  if (d.length <= 9) return d.slice(0,3) + '.' + d.slice(3,6) + '.' + d.slice(6);
  return d.slice(0,3) + '.' + d.slice(3,6) + '.' + d.slice(6,9) + '-' + d.slice(9);
}

/* ── Step 1: Endereço com CEP automático ── */
function StepEndereco({ form, set }) {
  const [buscandoCep, setBuscandoCep] = React.useState(false);
  const [cepErro, setCepErro] = React.useState('');

  const handleCep = async (raw) => {
    const masked = maskCep(raw);
    set('cep', masked);
    const digits = masked.replace(/\D/g,'');
    if (digits.length === 8) {
      setBuscandoCep(true); setCepErro('');
      try {
        const r = await fetch(`https://viacep.com.br/ws/${digits}/json/`);
        const d = await r.json();
        if (d.erro) { setCepErro('CEP não encontrado.'); }
        else {
          set('endereco', d.logradouro || '');
          set('bairro',   d.bairro     || '');
          set('cidade',   d.localidade || '');
          set('estado',   d.uf         || '');
          setCepErro('');
        }
      } catch { setCepErro('Erro ao buscar CEP. Verifique sua conexão.'); }
      setBuscandoCep(false);
    }
  };

  return (
    <div>
      <h3>Endereço residencial</h3>
      <p className="lead">Informe seu endereço atual.</p>

      {/* CEP primeiro para preencher automaticamente */}
      <div style={{ display:'grid', gridTemplateColumns:'180px 1fr', gap:12, marginBottom:0 }}>
        <div className="field">
          <label>CEP</label>
          <div style={{ position:'relative' }}>
            <input type="text" value={form.cep} onChange={e=>handleCep(e.target.value)} placeholder="00000-000" maxLength={9}
              style={{ paddingRight: buscandoCep ? 36 : 12 }}/>
            {buscandoCep && (
              <div style={{ position:'absolute', right:10, top:'50%', transform:'translateY(-50%)', width:16, height:16,
                border:'2px solid var(--navy)', borderTopColor:'transparent', borderRadius:'50%',
                animation:'spin 0.7s linear infinite' }}/>
            )}
          </div>
          {cepErro && <div className="hint" style={{ color:'var(--err)' }}>{cepErro}</div>}
          {buscandoCep && <div className="hint">Buscando endereço...</div>}
        </div>
        <div className="field">
          <label>Endereço <span className="req">*</span></label>
          <input type="text" value={form.endereco} onChange={e=>set('endereco',e.target.value)} placeholder="Rua, Avenida..."/>
        </div>
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'1fr 2fr', gap:12 }}>
        <div className="field"><label>Número</label><input type="text" value={form.numero} onChange={e=>set('numero',e.target.value)}/></div>
        <div className="field"><label>Complemento</label><input type="text" value={form.complemento} onChange={e=>set('complemento',e.target.value)} placeholder="Apto, Bloco..."/></div>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'2fr 2fr 1fr', gap:12 }}>
        <div className="field"><label>Bairro</label><input type="text" value={form.bairro} onChange={e=>set('bairro',e.target.value)}/></div>
        <div className="field"><label>Cidade <span className="req">*</span></label><input type="text" value={form.cidade} onChange={e=>set('cidade',e.target.value)}/></div>
        <div className="field"><label>Estado</label>
          <select value={form.estado} onChange={e=>set('estado',e.target.value)}>
            <option value="">—</option>
            {ESTADOS_BR.map(e=><option key={e}>{e}</option>)}
          </select>
        </div>
      </div>
    </div>
  );
}
