    historico:'', cargo1:'', cargo2:'', cargo3:'', cargo4:'',
  };

  const [step, setStep] = useState(0);
  const [form, setForm] = useState(empty);
  const [busy, setBusy] = useState(false);
  const [ok, setOk] = useState(false);
  const [err, setErr] = useState('');
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const validateStep = () => {
    if (step===0) {
      if (!form.nome.trim()) { setErr('Nome completo é obrigatório.'); return false; }
      if (!form.cpf.trim())  { setErr('CPF é obrigatório.'); return false; }
      if (!validarCPF(form.cpf.replace(/\D/g,''))) { setErr('CPF inválido. Verifique os dígitos.'); return false; }
      if (!form.sexo)        { setErr('Selecione o sexo.'); return false; }
      if (!form.escolaridade){ setErr('Selecione a escolaridade.'); return false; }
    }
    if (step===1) {
      if (!form.endereco.trim()) { setErr('Endereço é obrigatório.'); return false; }
      if (!form.cidade.trim())   { setErr('Cidade é obrigatória.'); return false; }
    }
    if (step===2) {
      if (!form.email.trim() && !form.celular.trim()) { setErr('Informe ao menos e-mail ou celular.'); return false; }
    }
    if (step===3) {
      if (!form.cargo1.trim()) { setErr('Informe ao menos um cargo pretendido.'); return false; }
    }
    setErr(''); return true;
  };

  const next = () => { if (validateStep()) setStep(s => Math.min(s+1, STEPS.length-1)); };
  const prev = () => { setErr(''); setStep(s => Math.max(s-1,0)); };

  const submit = async () => {
    setBusy(true); setErr('');
    await addCurriculo(form, user);
    await onPersist && onPersist();
    onChange && onChange();
    setOk(true); setBusy(false);
    setForm(empty); setStep(0);
  };

  const Row = ({label, val}) => val ? <div className="review-row"><span className="k">{label}</span><span className="v">{val}</span></div> : null;

  return (
    <div className="main-pad">
      <div className="page-title-row">
        <div className="page-title">
          <h2>Cadastro de Currículo</h2>
          <p>Preencha seus dados para se candidatar às vagas disponíveis no shopping</p>
        </div>
      </div>

      <div className="stepper-shell">
        <aside className="stepper-aside">
          <h3>Candidatura</h3>
          <h2>Seu Currículo</h2>
          <div className="step-list">
            {STEPS.map((s,i) => (
              <div key={i} className={`step-item ${i===step?'active':''} ${i<step?'done':''}`}>
                <div className="step-num">{i<step?<Icon name="check" size={12}/>:i+1}</div>
                <div className="step-label">{s.label}</div>
              </div>
            ))}
          </div>
          <div className="footer-tip">Seus dados são criptografados com AES-GCM 256-bit. Apenas os recrutadores autorizados têm acesso.</div>
        </aside>

        <div className="stepper-main">
          {ok && (
            <div style={{ textAlign:'center',padding:40 }}>
              <div style={{ fontSize:56,marginBottom:12 }}>✅</div>
              <div style={{ fontSize:20,fontWeight:600,color:'var(--ok)' }}>Currículo enviado com sucesso!</div>
              <p style={{ fontSize:13,color:'var(--ink-3)',marginTop:8,lineHeight:1.6 }}>Seus dados foram criptografados e armazenados com segurança. O lojista responsável pela vaga entrará em contato.</p>
              <button className="btn btn-ghost" style={{ marginTop:20 }} onClick={()=>setOk(false)}>Enviar outro currículo</button>
            </div>
          )}

          {/* STEP 0 — Dados pessoais */}
          {!ok && step===0 && (
            <div>
              <h3>Dados pessoais e profissionais</h3>
              <p className="lead">Preencha seus dados de identificação.</p>
              <div className="field"><label>Nome completo <span className="req">*</span></label><input type="text" value={form.nome} onChange={e=>set('nome',e.target.value)} placeholder="Seu nome completo"/></div>
              <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr',gap:12 }}>
                <div className="field">
                <label>CPF <span className="req">*</span></label>
                <input type="text" value={form.cpf}
                  onChange={e => set('cpf', maskCpf(e.target.value))}
                  placeholder="000.000.000-00" maxLength={14}
                  style={{ borderColor: form.cpf.replace(/\D/g,'').length===11 ? (validarCPF(form.cpf.replace(/\D/g,'')) ? 'var(--ok)' : 'var(--err)') : undefined }}/>
                {form.cpf.replace(/\D/g,'').length===11 && !validarCPF(form.cpf.replace(/\D/g,'')) && (
                  <div className="hint" style={{color:'var(--err)'}}>⚠ CPF inválido. Verifique os dígitos.</div>
                )}
                {form.cpf.replace(/\D/g,'').length===11 && validarCPF(form.cpf.replace(/\D/g,'')) && (
                  <div className="hint" style={{color:'var(--ok)'}}>✓ CPF válido</div>
                )}
              </div>
                <div className="field"><label>Data de nascimento</label><input type="date" value={form.dataNascimento} onChange={e=>set('dataNascimento',e.target.value)}/></div>
                <div className="field"><label>Sexo <span className="req">*</span></label>
                  <select value={form.sexo} onChange={e=>set('sexo',e.target.value)}>
                    <option value="">— Selecione —</option>
                    <option>Masculino</option><option>Feminino</option><option>Outro</option>
                  </select>
                </div>
                <div className="field"><label>Estado civil</label>
                  <select value={form.estadoCivil} onChange={e=>set('estadoCivil',e.target.value)}>
                    <option value="">— Selecione —</option>
                    {ESTADO_CIVIL.map(e=><option key={e}>{e}</option>)}
                  </select>
                </div>
                <div className="field"><label>Nacionalidade</label>
                  <select value={form.nacionalidade} onChange={e=>set('nacionalidade',e.target.value)}>
                    <option>Brasileira</option><option>Estrangeira</option>
                  </select>
                </div>
                <div className="field"><label>Escolaridade <span className="req">*</span></label>
                  <select value={form.escolaridade} onChange={e=>set('escolaridade',e.target.value)}>
                    <option value="">— Selecione —</option>
                    {ESCOLARIDADES.map(e=><option key={e}>{e}</option>)}
                  </select>
                </div>
              </div>
              <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr',gap:12 }}>
                <div className="field">
                  <label>Foto (JPG)</label>
                  <input type="file" accept="image/jpeg,image/jpg" onChange={e=>{ const f=e.target.files[0]; if(f){ const r=new FileReader(); r.onload=ev=>set('foto',ev.target.result); r.readAsDataURL(f); }}} style={{ height:'auto',padding:'8px 10px' }}/>
                  <div className="hint">Arquivo JPG. Será armazenado criptografado.</div>
                </div>
                <div className="field">
                  <label>Currículo (PDF)</label>
                  <input type="file" accept="application/pdf" onChange={e=>{ const f=e.target.files[0]; if(f){ const r=new FileReader(); r.onload=ev=>set('curriculo',ev.target.result); r.readAsDataURL(f); }}} style={{ height:'auto',padding:'8px 10px' }}/>
                  <div className="hint">Arquivo PDF. Será armazenado criptografado.</div>
                </div>
              </div>
            </div>
          )}

          {/* STEP 1 — Endereço */}
          {!ok && step===1 && (
            <StepEndereco form={form} set={set}/>
          )}

          {/* STEP 2 — Contato */}
          {!ok && step===2 && (
            <StepContato form={form} set={set}/>
          )}

          {/* STEP 3 — Histórico & Cargos */}
          {!ok && step===3 && (
            <div>
              <h3>Histórico, qualificação e objetivo profissional</h3>
              <p className="lead">Conte um pouco sobre você e os cargos que pretende.</p>
              <div className="field">
                <label>Escreva aqui um pouco mais sobre você</label>
                <textarea rows={5} value={form.historico} onChange={e=>set('historico',e.target.value)} placeholder="Experiências anteriores, habilidades, objetivos profissionais..."/>
              </div>
              <div className="divider"/>
              <div className="label-eyebrow">Cargos pretendidos</div>
              <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginTop:10 }}>
                {[1,2,3,4].map(n => (
                  <div className="field" key={n}>
                    <label>Cargo {n}{n===1?<span className="req">*</span>:''}</label>
                    <select value={form[`cargo${n}`]} onChange={e=>set(`cargo${n}`,e.target.value)}>
                      <option value="">— Selecione —</option>
                      {CARGOS_CURRICULO.map(c=><option key={c}>{c}</option>)}
                    </select>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* STEP 4 — Revisão */}
          {!ok && step===4 && (
            <div>
              <h3>Revisão final</h3>
              <p className="lead">Confirme seus dados antes de enviar.</p>
              <div style={{ background:'var(--surface-2)',borderRadius:10,padding:16,marginBottom:16 }}>
                <div className="label-eyebrow" style={{ marginBottom:10 }}>Dados pessoais</div>
                <Row label="Nome"          val={form.nome}/>
                <Row label="CPF"           val={form.cpf}/>
                <Row label="Nascimento"    val={form.dataNascimento}/>
                <Row label="Sexo"          val={form.sexo}/>
                <Row label="Estado civil"  val={form.estadoCivil}/>
                <Row label="Nacionalidade" val={form.nacionalidade}/>
                <Row label="Escolaridade"  val={form.escolaridade}/>
                <Row label="Foto"          val={form.foto?'✅ Anexada':'—'}/>
                <Row label="Currículo PDF" val={form.curriculo?'✅ Anexado':'—'}/>
              </div>
              <div style={{ background:'var(--surface-2)',borderRadius:10,padding:16,marginBottom:16 }}>
                <div className="label-eyebrow" style={{ marginBottom:10 }}>Endereço</div>
                <Row label="Endereço" val={[form.endereco,form.numero,form.complemento].filter(Boolean).join(', ')}/>
                <Row label="Bairro"   val={form.bairro}/>
                <Row label="Cidade"   val={[form.cidade,form.estado].filter(Boolean).join(' — ')}/>
                <Row label="CEP"      val={form.cep}/>
              </div>
              <div style={{ background:'var(--surface-2)',borderRadius:10,padding:16,marginBottom:16 }}>
                <div className="label-eyebrow" style={{ marginBottom:10 }}>Contato</div>
                <Row label="E-mail"    val={form.email}/>
                <Row label="Celular"   val={form.celular}/>
                <Row label="Instagram" val={form.instagram}/>
                <Row label="LinkedIn"  val={form.linkedin}/>
                <Row label="Facebook"  val={form.facebook}/>
              </div>
              <div style={{ background:'var(--surface-2)',borderRadius:10,padding:16,marginBottom:16 }}>
                <div className="label-eyebrow" style={{ marginBottom:10 }}>Cargos pretendidos</div>
                {[1,2,3,4].map(n => <Row key={n} label={`Cargo ${n}`} val={form[`cargo${n}`]}/>)}
              </div>
              <div style={{ fontSize:11,color:'var(--ink-3)',display:'flex',alignItems:'center',gap:6,padding:'10px 0' }}>
                <Icon name="shield" size={12}/> Todos os dados serão criptografados (AES-GCM 256-bit) antes do envio.
              </div>
            </div>
          )}

          {err && !ok && <div style={{ color:'var(--err)',fontSize:12,padding:'8px 12px',background:'var(--err-bg)',borderRadius:8,marginTop:12 }}>{err}</div>}

          {!ok && (
            <div className="stepper-foot">
              <button className="btn btn-ghost" onClick={step===0?()=>{}:prev}>
                <Icon name="arrow-left" size={13}/> {step===0?'Cancelar':'Voltar'}
              </button>
              {step < STEPS.length-1
                ? <button className="btn btn-primary" onClick={next}>Continuar <Icon name="arrow-right" size={13}/></button>
                : <button className="btn btn-gold" onClick={submit} disabled={busy}>
                    <Icon name="send" size={13}/> {busy?'Enviando...':'Enviar currículo'}
                  </button>
              }
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════
   MÓDULO GIS — ADMINISTRAÇÃO (Desbloqueio de Períodos)
   ════════════════════════════════════════════════════════════════ */
function GISAdminScreen({ user, onPersist, onChange }) {
  if (!hasPerm(user, 'gis', 'approve')) return <Blocked/>;

  const today   = new Date();
  const [viewYear,  setViewYear]  = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());

  /* Combo: lista de usuários que têm perfil lojista (todos exceto admins sem loja) */
  const storeUsers = (DB?.users || []).filter(u => u.store && u.store.trim() !== '');
  const [selectedUserId, setSelectedUserId] = useState(storeUsers[0]?.id || '');

  /* Load encrypted GIS record for selected user */
  const [vendas,    setVendas]    = useState({});
  const [sentWeeks, setSentWeeks] = useState({});
  const [loading,   setLoading]   = useState(false);
  const [feedback,  setFeedback]  = useState(null); // { msg, tone }
  const [confirm,   setConfirm]   = useState(null); // { type, label, payload }

  const MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const DAY_NAMES   = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];

  /* ── Load & decrypt selected user's GIS data ── */
  const loadUserData = async (uid) => {
    setLoading(true); setFeedback(null);
    setVendas({}); setSentWeeks({});
    try {
      const rec = (DB.gisVendas || []).find(r => r.userId === uid);
      if (!rec) { setLoading(false); return; }
      const [dataStr, sentStr] = await Promise.all([
        decryptField(rec.encData || '{}'),
        decryptField(rec.encSent || '{}'),
      ]);
      setVendas(JSON.parse(dataStr   || '{}'));
      setSentWeeks(JSON.parse(sentStr || '{}'));
    } catch(e) { setFeedback({ msg:'Erro ao descriptografar dados.', tone:'err' }); }
    setLoading(false);
  };

  useEffect(() => { if (selectedUserId) loadUserData(selectedUserId); }, [selectedUserId, viewYear, viewMonth]);

  /* ── Persist unlocked sentWeeks back encrypted ── */
  const persistUnlock = async (newSent, label) => {
    try {
      if (!DB.gisVendas) DB.gisVendas = [];
      const idx = DB.gisVendas.findIndex(r => r.userId === selectedUserId);
      if (idx < 0) return;
      const rec = DB.gisVendas[idx];
      // Re-encrypt sentWeeks; leave encData untouched
      const [encSentNew, encPeriodo] = await Promise.all([
        encryptField(JSON.stringify(newSent)),
        encryptField(`${viewYear}-${String(viewMonth+1).padStart(2,'0')}`),
      ]);
      DB.gisVendas[idx] = { ...rec, encSent: encSentNew, encPeriodo, updatedAt: Date.now() };
      // Also update user's own localStorage key if same browser
      const userSentKey = `gis_s_${btoa(selectedUserId).replace(/=/g,'')}`;
      const encForLS = await encryptField(JSON.stringify(newSent));
      localStorage.setItem(userSentKey, encForLS);
      saveDBLocal(DB);
      onPersist && onPersist();
      setSentWeeks(newSent);
      setFeedback({ msg:`✅ ${label} desbloqueado com sucesso.`, tone:'ok' });
      setTimeout(() => setFeedback(null), 4000);
    } catch(e) { setFeedback({ msg:'Erro ao salvar desbloqueio.', tone:'err' }); }
    setConfirm(null);
  };

  /* ── Unlock handlers ── */
  const unlockDay = (dayKey) => {
    const label = `Dia ${dayKey}`;
    setConfirm({ type:'day', label, payload: dayKey });
  };
  const unlockWeek = (weekIdx) => {
    const wk = getWeekKey(viewYear, viewMonth, weekIdx);
    setConfirm({ type:'week', label: `Semana ${weekIdx + 1} de ${MONTH_NAMES[viewMonth]}/${viewYear}`, payload: wk });
  };
  const unlockMonth = () => {
    setConfirm({ type:'month', label: `Mês inteiro de ${MONTH_NAMES[viewMonth]}/${viewYear}`, payload: null });
  };

  const executeUnlock = async () => {
    if (!confirm) return;
    let newSent = { ...sentWeeks };
    if (confirm.type === 'day') {
      // Remove sent flag from any week that contains this day
      const dayDate = new Date(confirm.payload);
      Object.keys(newSent).forEach(wk => {
        // Rebuild week to check if day belongs to it
        const parts = wk.split('_'); // gis_YEAR_MM_wN
        if (parts.length < 4) return;
        const yr = parseInt(parts[1]); const mo = parseInt(parts[2]) - 1; const wi = parseInt(parts[3].slice(1));
        if (yr !== dayDate.getFullYear() || mo !== dayDate.getMonth()) return;
        const cal = buildCalendar(yr, mo);
        const week = cal[wi];
        if (!week) return;
        const hasDay = week.some(c => !c.outside && c.month === mo && getDayKey(yr, mo, c.day) === confirm.payload);
        if (hasDay) delete newSent[wk];
      });
      // Mark day as unlocked individually
      newSent[`day_unlock_${confirm.payload}`] = { unlockedAt: Date.now(), by: user.nome };
    } else if (confirm.type === 'week') {
      delete newSent[confirm.payload];
    } else if (confirm.type === 'month') {
      const prefix = `gis_${viewYear}_${String(viewMonth+1).padStart(2,'0')}`;
      newSent = Object.fromEntries(Object.entries(newSent).filter(([k]) => !k.startsWith(prefix)));
    }
    await persistUnlock(newSent, confirm.label);
  };

  /* ── Calendar helpers ── */
  const weeks = buildCalendar(viewYear, viewMonth);
  const isSentWeek = (wi) => !!sentWeeks[getWeekKey(viewYear, viewMonth, wi)];
  const isDayUnlocked = (dayKey) => !!sentWeeks[`day_unlock_${dayKey}`];
  const monthHasSent = weeks.some((_, wi) => isSentWeek(wi));
  const getDayVal = (dayKey) => {
    const v = vendas[dayKey];
    return (v && v.value !== null && v.value !== undefined) ? v.value : null;
  };

  const selectedUser = storeUsers.find(u => u.id === selectedUserId);

  return (
    <div className="gis-shell">

      {/* Confirm modal */}
      {confirm && (
        <div className="modal-overlay">
          <div className="modal-card" style={{ maxWidth:440 }}>
            <button className="close-x" onClick={() => setConfirm(null)}><Icon name="x" size={16}/></button>
            <div style={{ fontSize:32, textAlign:'center', marginBottom:12 }}>🔓</div>
            <h3 style={{ textAlign:'center' }}>Confirmar Desbloqueio</h3>
            <p style={{ fontSize:13, color:'var(--ink-2)', margin:'12px 0 20px', textAlign:'center', lineHeight:1.55 }}>
              Deseja reabilitar o envio de <strong>{confirm.label}</strong> para a loja <strong>{selectedUser?.store || selectedUser?.nome}</strong>?<br/>
              <span style={{ fontSize:12, color:'var(--ink-3)' }}>O lojista poderá editar e reenviar o período.</span>
            </p>
            <div style={{ display:'flex', gap:10, justifyContent:'center' }}>
              <button className="btn btn-ghost" onClick={() => setConfirm(null)}>Cancelar</button>
              <button className="btn btn-gold" onClick={executeUnlock}><Icon name="unlock" size={14}/> Desbloquear</button>
            </div>
          </div>
        </div>
      )}

      {/* Header */}
      <div className="gis-topbar">
        <div className="page-title">
          <h2 style={{ display:'flex', alignItems:'center', gap:10 }}>
            <Icon name="key" size={22} style={{ color:'var(--navy)' }}/>
            Administração GIS · Desbloqueio de Períodos
          </h2>
          <p>Reabilite dias, semanas ou meses enviados por lojistas</p>
        </div>
        <div className="gis-nav-month">
          <span className="gis-month-adj" onClick={() => { if(viewMonth===0){setViewYear(y=>y-1);setViewMonth(11);}else setViewMonth(m=>m-1); }}>
            ‹ {MONTH_NAMES[viewMonth===0?11:viewMonth-1].slice(0,3)}
          </span>
          <div className="gis-month-label">{MONTH_NAMES[viewMonth]} / {viewYear}</div>
          <span className="gis-month-adj" onClick={() => { if(viewMonth===11){setViewYear(y=>y+1);setViewMonth(0);}else setViewMonth(m=>m+1); }}>
            {MONTH_NAMES[viewMonth===11?0:viewMonth+1].slice(0,3)} ›
          </span>
        </div>
      </div>

      {/* Loja selector */}
      <div className="card" style={{ marginBottom:20 }}>
        <div style={{ display:'flex', alignItems:'center', gap:16, flexWrap:'wrap' }}>
          <div style={{ display:'flex', alignItems:'center', gap:8, flex:1, minWidth:260 }}>
            <Icon name="building" size={16} style={{ color:'var(--navy)', flexShrink:0 }}/>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:11, fontWeight:600, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:4 }}>Selecionar Loja / Responsável</div>
              <select
                value={selectedUserId}
                onChange={e => setSelectedUserId(e.target.value)}
                style={{ width:'100%', height:38, background:'var(--surface-2)', border:'1px solid var(--line)', borderRadius:8, padding:'0 12px', fontSize:13, color:'var(--ink)', outline:'none', fontFamily:'inherit' }}
              >
                {storeUsers.length === 0 && <option value="">Nenhum lojista cadastrado</option>}
                {storeUsers.map(u => (
                  <option key={u.id} value={u.id}>{u.store} — {u.nome}</option>
                ))}
              </select>
            </div>
          </div>
          {selectedUser && (
            <div style={{ display:'flex', gap:8 }}>
              <div style={{ background:'var(--surface-2)', borderRadius:8, padding:'8px 14px', fontSize:12 }}>
                <div style={{ color:'var(--ink-3)', marginBottom:2 }}>Cargo</div>
                <div style={{ fontWeight:600 }}>{selectedUser.cargo || '—'}</div>
              </div>
              <div style={{ background:'var(--surface-2)', borderRadius:8, padding:'8px 14px', fontSize:12 }}>
                <div style={{ color:'var(--ink-3)', marginBottom:2 }}>Perfil</div>
                <div style={{ fontWeight:600 }}>{selectedUser.role === 'admin' ? 'Admin' : selectedUser.role === 'gestor' ? 'Gestor' : 'Colaborador'}</div>
              </div>
            </div>
          )}
          {monthHasSent && (
            <button className="btn btn-danger" onClick={unlockMonth} title="Desbloquear todo o mês">
              <Icon name="unlock" size={14}/> Desbloquear Mês Inteiro
            </button>
          )}
        </div>
      </div>

      {/* Feedback banner */}
      {feedback && (
        <div style={{ padding:'10px 16px', borderRadius:8, fontSize:13, marginBottom:16,
          background: feedback.tone==='ok' ? 'var(--ok-bg)' : 'var(--err-bg)',
          color:      feedback.tone==='ok' ? 'var(--ok)'    : 'var(--err)',
          border: `1px solid ${feedback.tone==='ok' ? 'var(--ok)' : 'var(--err)'}`,
          display:'flex', alignItems:'center', gap:8 }}>
          <Icon name={feedback.tone==='ok'?'check-circle':'x'} size={15}/>
          {feedback.msg}
        </div>
      )}

      {loading ? (
        <div style={{ textAlign:'center', padding:60, color:'var(--ink-3)' }}>
          <Icon name="shield" size={28} style={{ display:'block', margin:'0 auto 12px', color:'var(--navy)' }}/>
          <div style={{ fontSize:13 }}>Descriptografando dados da loja…</div>
        </div>
      ) : storeUsers.length === 0 ? (
        <div className="card" style={{ textAlign:'center', padding:48 }}>
          <Icon name="building" size={32} style={{ display:'block', margin:'0 auto 12px', color:'var(--ink-4)' }}/>
          <div style={{ fontWeight:600, color:'var(--ink-2)', marginBottom:6 }}>Nenhum lojista cadastrado</div>
          <p style={{ fontSize:13, color:'var(--ink-3)' }}>Cadastre usuários com o campo "Loja" preenchido no módulo Usuários.</p>
        </div>
      ) : (
        <>
          {/* Calendar */}
          <div className="gis-calendar">
            {/* Header */}
            <div className="gis-cal-head">
              {DAY_NAMES.map(d => (
                <div key={d} className="gis-cal-head-cell">{d}</div>
              ))}
              <div className="gis-cal-head-cell total-col">Semana</div>
            </div>

            {weeks.map((week, wi) => {
              const sent = isSentWeek(wi);
              const wTotal = (() => {
                let t = 0; let any = false;
                week.forEach(c => {
                  if (!c.outside && c.month === viewMonth) {
                    const v = getDayVal(getDayKey(viewYear, viewMonth, c.day));
                    if (v !== null) { t += v; any = true; }
                  }
                });
                return any ? t : null;
              })();

              return (
                <div key={wi} className="gis-week-row">
                  {week.map((cell, di) => {
                    const outside = cell.outside;
                    const isWE = di === 0 || di === 6;
                    const dayKey = !outside ? getDayKey(viewYear, cell.month, cell.day) : null;
                    const val = dayKey ? getDayVal(dayKey) : null;
                    const dayUnlocked = dayKey ? isDayUnlocked(dayKey) : false;
                    const todayCell = !outside && new Date(viewYear, viewMonth, cell.day).toDateString() === today.toDateString();

                    let cellClass = 'gis-day-cell';
                    if (isWE)     cellClass += ' weekend';
                    if (outside)  cellClass += ' outside';
                    if (todayCell) cellClass += ' today';
                    if (val !== null) cellClass += ' has-value';

                    return (
                      <div key={di} className={cellClass} style={{ position:'relative' }}>
                        {!outside && (
                          <>
                            <div className="gis-day-num" style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                              <span>{cell.day}</span>
                              {sent && val !== null && !dayUnlocked && cell.month === viewMonth && (
                                <button
                                  title="Desbloquear este dia"
                                  onClick={() => unlockDay(dayKey)}
                                  style={{ background:'transparent', border:'none', cursor:'pointer', padding:'1px 3px', borderRadius:4, color:'var(--warn)', lineHeight:1 }}
                                >
                                  <Icon name="unlock" size={11}/>
                                </button>
                              )}
                              {dayUnlocked && (
                                <span title="Dia desbloqueado" style={{ color:'var(--ok)', fontSize:10 }}>🔓</span>
                              )}
                            </div>
                            {val !== null && cell.month === viewMonth && (
                              <div style={{
                                marginTop:'auto', fontSize:11, fontFamily:'JetBrains Mono,monospace', fontWeight:600,
                                textAlign:'right', padding:'3px 4px', borderRadius:5,
                                background: sent && !dayUnlocked ? 'var(--warn-bg)' : 'var(--ok-bg)',
                                color:      sent && !dayUnlocked ? 'var(--warn)'    : 'var(--ok)',
                                border:    `1px solid ${sent && !dayUnlocked ? '#fcd34d' : 'rgba(22,163,74,0.2)'}`,
                              }}>
                                {fmtBRL(val)}
                              </div>
                            )}
                          </>
                        )}
                      </div>
                    );
                  })}

                  {/* Total + unlock week */}
                  <div className="gis-day-cell gis-total-cell">
                    <div className="total-label">Semana {wi+1}</div>
                    {wTotal !== null ? (
                      <div className="total-value has-value">{fmtBRL(wTotal)}</div>
                    ) : (
                      <div className="total-value empty">—</div>
                    )}
                    {sent ? (
                      <div style={{ marginTop:6, display:'flex', flexDirection:'column', gap:4 }}>
                        <span className="gis-week-sent-badge"><Icon name="check" size={10}/> Enviada</span>
                        <button className="btn btn-sm" style={{ fontSize:10, height:22, padding:'0 8px', background:'var(--warn-bg)', border:'1px solid var(--warn)', color:'var(--warn)' }}
                          onClick={() => unlockWeek(wi)}>
                          <Icon name="unlock" size={11}/> Desbloquear
                        </button>
                      </div>
                    ) : (
                      <span className="gis-week-sent-badge pending">Pendente</span>
                    )}
                  </div>
                </div>
              );
            })}

            {/* Footer */}
            <div className="gis-footer-bar">
              <div className="gis-hint">
                <Icon name="shield" size={13}/>
                <span>Dados criptografados AES-GCM 256-bit. Desbloqueios ficam registrados com data e responsável.</span>
              </div>
              <div className="gis-month-total">
                <div className="mt-label">Total {MONTH_NAMES[viewMonth]}</div>
                <div className="mt-value">
                  {(() => { let t = 0; let any = false;
                    Object.keys(vendas).forEach(k => {
                      const d = new Date(k);
                      if (d.getFullYear()===viewYear && d.getMonth()===viewMonth && vendas[k]?.value !== null) { t += vendas[k].value||0; any=true; }
                    });
                    return any ? fmtBRL(t) : '—';
                  })()}
                </div>
              </div>
            </div>
          </div>

          {/* Unlock log */}
          {Object.keys(sentWeeks).some(k => k.startsWith('day_unlock_')) && (
            <div className="card" style={{ marginTop:20 }}>
              <div className="card-head"><h3>🔓 Histórico de Desbloqueios</h3></div>
              <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                {Object.entries(sentWeeks)
                  .filter(([k]) => k.startsWith('day_unlock_'))
                  .sort(([,a],[,b]) => (b.unlockedAt||0) - (a.unlockedAt||0))
                  .map(([k, v]) => (
                    <div key={k} style={{ display:'flex', alignItems:'center', gap:12, padding:'8px 12px', background:'var(--surface-2)', borderRadius:8, fontSize:12 }}>
                      <Icon name="unlock" size={14} style={{ color:'var(--warn)', flexShrink:0 }}/>
                      <div style={{ flex:1 }}>
                        <strong>Dia {k.replace('day_unlock_', '')}</strong>
                        {v.by && <span style={{ color:'var(--ink-3)' }}> · desbloqueado por {v.by}</span>}
                      </div>
                      <span style={{ color:'var(--ink-4)', fontFamily:'JetBrains Mono,monospace' }}>
                        {v.unlockedAt ? new Date(v.unlockedAt).toLocaleString('pt-BR') : ''}
                      </span>
                    </div>
                  ))
                }
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════
   MÓDULO GIS — DECLARAÇÃO DE VENDAS DIÁRIAS (Lojista)
   ════════════════════════════════════════════════════════════════ */

function fmtBRL(val) {
  if (val === null || val === undefined || val === '') return '';
  const n = parseFloat(String(val).replace(',', '.'));
  if (isNaN(n)) return '';
  return n.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}

function parseBRL(str) {
  if (!str || str.trim() === '') return null;
  const cleaned = str.replace(/[R$\s]/g,'').replace('.','').replace(',','.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? null : n;
}

function getWeekKey(year, month, weekIdx) {
  return `gis_${year}_${String(month+1).padStart(2,'0')}_w${weekIdx}`;
}

function getDayKey(year, month, day) {
  return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

function buildCalendar(year, month) {
  const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrev  = new Date(year, month, 0).getDate();
  const weeks = [];
  let day = 1;
  let prevDay = daysInPrev - firstDay + 1;

  while (day <= daysInMonth) {
    const week = [];
    for (let d = 0; d < 7; d++) {
      if (weeks.length === 0 && d < firstDay) {
        week.push({ day: prevDay + d, outside: true, month: month - 1 });
      } else if (day > daysInMonth) {
        week.push({ day: day - daysInMonth, outside: true, month: month + 1 });
        day++;
      } else {
        week.push({ day, outside: false, month });
        day++;
      }
    }
    weeks.push(week);
  }
  return weeks;
}

function GISScreen({ user, onPersist, onChange }) {
  if (!hasPerm(user, 'gis', 'view')) return <Blocked/>;

  const today = new Date();
  const [viewYear,  setViewYear]  = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());

  // vendas: { [dayKey]: { value: number|null, savedAt: timestamp } }  — plaintext in memory only
  const [vendas,    setVendas]    = useState({});
  // sentWeeks: { [weekKey]: { sentAt, user, store } }                 — plaintext in memory only
  const [sentWeeks, setSentWeeks] = useState({});
  const [cryptoReady, setCryptoReady] = useState(false);
  const [editValues, setEditValues] = useState({});
  const [saved, setSaved] = useState({});

  /* ── Encrypted localStorage keys (opaque, no PII in key name) ── */
  const storageKey = `gis_v_${btoa(user.id).replace(/=/g,'')}`;
  const sentKey    = `gis_s_${btoa(user.id).replace(/=/g,'')}`;

  /* ── Load & decrypt on mount ── */
  useEffect(() => {
    (async () => {
      try {
        const rawV = localStorage.getItem(storageKey);
        if (rawV) {
          const dec = await decryptField(rawV);
          if (dec && dec !== '***') setVendas(JSON.parse(dec));
        }
        const rawS = localStorage.getItem(sentKey);
        if (rawS) {
          const dec = await decryptField(rawS);
          if (dec && dec !== '***') setSentWeeks(JSON.parse(dec));
        }
      } catch(e) { /* first use or key mismatch — start fresh */ }
      setCryptoReady(true);
    })();
  }, []);

  /* ── Encrypt & persist vendas + full GIS record to DB ── */
  const saveToStorage = async (newVendas, newSent) => {
    const vendasToSave = newVendas !== undefined ? newVendas : vendas;
    const sentToSave   = newSent   !== undefined ? newSent   : sentWeeks;

    // Encrypt each sensitive piece separately before localStorage
    const encVendas = await encryptField(JSON.stringify(vendasToSave));
    const encSent   = await encryptField(JSON.stringify(sentToSave));
    localStorage.setItem(storageKey, encVendas);
    localStorage.setItem(sentKey,    encSent);

    // Build encrypted DB record — no plaintext PII stored
    if (!DB.gisVendas) DB.gisVendas = [];
    const [encStore, encPeriodo, encData, encSentDB] = await Promise.all([
      encryptField(user.store || user.nome),
      encryptField(`${viewYear}-${String(viewMonth+1).padStart(2,'0')}`),
      encryptField(JSON.stringify(vendasToSave)),
      encryptField(JSON.stringify(sentToSave)),
    ]);
    const rec = {
      userId:    user.id,          // non-sensitive identifier only
      encStore,
      encPeriodo,
      encData,
      encSent:   encSentDB,
      updatedAt: Date.now(),
    };
    const idx = DB.gisVendas.findIndex(r => r.userId === user.id);
    if (idx >= 0) DB.gisVendas[idx] = rec; else DB.gisVendas.push(rec);
    saveDBLocal(DB);
    onPersist && onPersist();
  };

  const weeks = buildCalendar(viewYear, viewMonth);

  const prevMonth = () => {
    if (viewMonth === 0) { setViewYear(y => y-1); setViewMonth(11); }
    else setViewMonth(m => m-1);
  };
  const nextMonth = () => {
    if (viewMonth === 11) { setViewYear(y => y+1); setViewMonth(0); }
    else setViewMonth(m => m+1);
  };

  const isWeekend = (dayOfWeek) => dayOfWeek === 0 || dayOfWeek === 6;
  const isPast = (d) => {
    const dc = new Date(viewYear, viewMonth, d); dc.setHours(0,0,0,0);
    const td = new Date(); td.setHours(0,0,0,0);
    return dc <= td;
  };
  const isToday = (d) => {
    const dc = new Date(viewYear, viewMonth, d);
    return dc.toDateString() === today.toDateString();
  };

  const handleInput = (dayKey, val) => {
    // Allow only digits, comma and dot
    const clean = val.replace(/[^0-9.,]/g, '');
    setEditValues(prev => ({ ...prev, [dayKey]: clean }));
  };

  const handleBlur = async (dayKey, rawVal) => {
    const n = parseBRL(rawVal);
    const newVendas = { ...vendas, [dayKey]: { value: n, savedAt: Date.now() } };
    setVendas(newVendas);
    await saveToStorage(newVendas, undefined);
    setSaved(prev => ({ ...prev, [dayKey]: true }));
    setTimeout(() => setSaved(prev => ({ ...prev, [dayKey]: false })), 1200);
    setEditValues(prev => { const c = {...prev}; delete c[dayKey]; return c; });
  };

  const getVal = (dayKey) => {
    if (dayKey in editValues) return editValues[dayKey];
    const stored = vendas[dayKey];
    if (!stored || stored.value === null || stored.value === undefined) return '';
    return stored.value.toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
  };

  const getNumVal = (dayKey) => {
    const stored = vendas[dayKey];
    return (stored && stored.value !== null && stored.value !== undefined) ? stored.value : null;
  };

  const weekTotal = (week) => {
    let total = 0; let hasAny = false;
    week.forEach((cell, di) => {
      if (!cell.outside && cell.month === viewMonth) {
        const dk = getDayKey(viewYear, viewMonth, cell.day);
        const v = getNumVal(dk);
        if (v !== null) { total += v; hasAny = true; }
      }
    });
    return hasAny ? total : null;
  };

  const monthTotal = () => {
    let total = 0; let hasAny = false;
    weeks.forEach(week => {
      const wt = weekTotal(week);
      if (wt !== null) { total += wt; hasAny = true; }
    });
    return hasAny ? total : null;
  };

  const sendWeek = async (weekIdx, week) => {
    const wk = getWeekKey(viewYear, viewMonth, weekIdx);
    const newSent = { ...sentWeeks, [wk]: { sentAt: Date.now(), user: user.nome, store: user.store || '' } };
    setSentWeeks(newSent);
    await saveToStorage(undefined, newSent);
  };

  const isSent = (weekIdx) => {
    const wk = getWeekKey(viewYear, viewMonth, weekIdx);
    return !!sentWeeks[wk];
  };

  const weekHasData = (week) => {
    return week.some((cell, di) => {
      if (cell.outside || cell.month !== viewMonth) return false;
      return getNumVal(getDayKey(viewYear, viewMonth, cell.day)) !== null;
    });
  };

  // Alert: check if any past week has not been sent
  const overdueWeeks = weeks.filter((week, wi) => {
    const lastCellInWeek = week.filter(c => !c.outside && c.month === viewMonth).pop();
    if (!lastCellInWeek) return false;
    const lastDate = new Date(viewYear, viewMonth, lastCellInWeek.day);
    lastDate.setHours(23,59,59,999);
    return lastDate < today && !isSent(wi) && weekHasData(week);
  });

  const MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const DAY_NAMES   = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];

  const mt = monthTotal();
  // stats
  const diasPreenchidos = Object.keys(vendas).filter(k => {
    const d = new Date(k); return d.getFullYear()===viewYear && d.getMonth()===viewMonth && vendas[k]?.value !== null;
  }).length;
  const diasDoMes = new Date(viewYear, viewMonth+1, 0).getDate();
  const semanaEnviadas = Object.keys(sentWeeks).filter(k => k.startsWith(`gis_${viewYear}_${String(viewMonth+1).padStart(2,'0')}`)).length;

  return (
    <div className="gis-shell">
      {!cryptoReady && (
        <div style={{ textAlign:'center', padding:60, color:'var(--ink-3)' }}>
          <Icon name="shield" size={28} style={{ display:'block', margin:'0 auto 12px', color:'var(--navy)' }}/>
          <div style={{ fontSize:13 }}>Descriptografando dados…</div>
        </div>
      )}
      {cryptoReady && (<>
      {/* Header */}
      <div className="gis-topbar">
        <div className="page-title">
          <h2 style={{ display:'flex', alignItems:'center', gap:10 }}>
            <Icon name="chart-bar" size={22} style={{ color:'var(--navy)' }}/>
            GIS · Declaração de Vendas Diárias
          </h2>
          <p style={{ marginTop:2 }}>{user.store || user.nome} · {MONTH_NAMES[viewMonth]} de {viewYear}</p>
        </div>
        <div className="gis-nav-month">
          <span className="gis-month-adj" onClick={prevMonth}>‹ {MONTH_NAMES[viewMonth===0?11:viewMonth-1].slice(0,3)}</span>
          <div style={{ textAlign:'center' }}>
            <div className="gis-month-label">{MONTH_NAMES[viewMonth]} / {viewYear}</div>
          </div>
          <span className="gis-month-adj" onClick={nextMonth}>{MONTH_NAMES[viewMonth===11?0:viewMonth+1].slice(0,3)} ›</span>
        </div>
      </div>

      {/* Stat cards */}
      <div className="gis-status-panel">
        <div className="gis-stat-card">
          <div className="gis-stat-icon" style={{ background:'var(--info-bg)' }}><Icon name="calendar" size={18} style={{ color:'var(--info)' }}/></div>
          <div>
            <div className="gis-stat-num" style={{ color:'var(--info)' }}>{diasPreenchidos}/{diasDoMes}</div>
            <div className="gis-stat-lbl">Dias do mês preenchidos</div>
          </div>
        </div>
        <div className="gis-stat-card">
          <div className="gis-stat-icon" style={{ background:'var(--ok-bg)' }}><Icon name="send" size={18} style={{ color:'var(--ok)' }}/></div>
          <div>
            <div className="gis-stat-num" style={{ color:'var(--ok)' }}>{semanaEnviadas}</div>
            <div className="gis-stat-lbl">Semanas enviadas</div>
          </div>
        </div>
        <div className="gis-stat-card">
          <div className="gis-stat-icon" style={{ background:'var(--gold-soft)' }}><Icon name="chart-bar" size={18} style={{ color:'var(--gold-2)' }}/></div>
          <div>
            <div className="gis-stat-num" style={{ color:'var(--gold-2)', fontSize:16 }}>{mt !== null ? fmtBRL(mt) : '—'}</div>
            <div className="gis-stat-lbl">Total do mês</div>
          </div>
        </div>
      </div>

      {/* Alert banners */}
      {overdueWeeks.length > 0 && (
        <div className="gis-alert-banner">
          ⚠️ <span>Enviar semana atual até: <strong>IMEDIATO</strong>, o envio desta semana está atrasado. Clique em <strong>Enviar semana</strong> nas linhas pendentes.</span>
        </div>
      )}

      {/* Calendar */}
      <div className="gis-calendar">
        {/* Header row */}
        <div className="gis-cal-head">
          {DAY_NAMES.map(d => (
            <div key={d} className={`gis-cal-head-cell${d==='DOM'||d==='SÁB'?' total-col':''}`}>{d}</div>
          ))}
          <div className="gis-cal-head-cell total-col">Total da semana</div>
        </div>

        {/* Week rows */}
        {weeks.map((week, wi) => {
          const wTotal = weekTotal(week);
          const sent = isSent(wi);
          const hasData = weekHasData(week);
          const wk = getWeekKey(viewYear, viewMonth, wi);
          const sentInfo = sentWeeks[wk];
          // Is this week in the past?
          const lastCell = week.filter(c => !c.outside && c.month === viewMonth).pop();
          const weekPast = lastCell ? new Date(viewYear, viewMonth, lastCell.day) < today : false;

          return (
            <div key={wi} className="gis-week-row">
              {week.map((cell, di) => {
                const isWE = isWeekend(di);
                const outside = cell.outside;
                const past = !outside && isPast(cell.day) && cell.month === viewMonth;
                const dayKey = !outside ? getDayKey(viewYear, cell.month, cell.day) : null;
                const filled = dayKey && getNumVal(dayKey) !== null;
                const todayCell = !outside && isToday(cell.day) && cell.month === viewMonth;
                // A day is editable if: week not sent, OR admin unlocked this specific day
                const dayUnlocked = dayKey ? !!sentWeeks[`day_unlock_${dayKey}`] : false;
                const inputDisabled = sent && !dayUnlocked;

                let cellClass = 'gis-day-cell';
                if (isWE)    cellClass += ' weekend';
                if (outside) cellClass += ' outside';
                if (todayCell) cellClass += ' today';
                if (!outside && !isWE && past) cellClass += ' past';
                if (!outside && !isWE && !past && !outside && cell.month === viewMonth) cellClass += ' future';
                if (filled)  cellClass += ' has-value';

                return (
                  <div key={di} className={cellClass}>
                    {!outside && (
                      <>
                        <div className="gis-day-num" style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                          <span>{!outside && cell.day}</span>
                          {dayUnlocked && <span title="Dia desbloqueado pelo administrador" style={{ fontSize:10 }}>🔓</span>}
                        </div>
                        {cell.month === viewMonth && (
                          <input
                            type="text"
                            className={`gis-day-input${filled ? ' filled' : ''}`}
                            value={getVal(dayKey)}
                            onChange={e => handleInput(dayKey, e.target.value)}
                            onBlur={e => handleBlur(dayKey, e.target.value)}
                            onKeyDown={e => {
                              if(e.key==='Enter') { e.target.blur(); return; }
                              // Allow: backspace, delete, tab, arrows, home, end
                              const allow = ['Backspace','Delete','Tab','ArrowLeft','ArrowRight','Home','End'];
                              if (allow.includes(e.key)) return;
                              // Allow: digits, comma, dot
                              if (/^[0-9.,]$/.test(e.key)) return;
                              e.preventDefault();
                            }}
                            inputMode="decimal"                            placeholder="0,00"
                            disabled={inputDisabled}
                            title={inputDisabled ? 'Semana já enviada. Solicite desbloqueio ao administrador.' : filled ? `R$ ${getNumVal(dayKey)?.toLocaleString('pt-BR',{minimumFractionDigits:2})}` : 'Clique para inserir o valor'}
                          />
                        )}
                      </>
                    )}
                  </div>
                );
              })}

              {/* Total + Enviar */}
              <div className="gis-day-cell gis-total-cell">
                <div className="total-label">Semana {wi+1}</div>
                {wTotal !== null ? (
                  <div className="total-value has-value">{fmtBRL(wTotal)}</div>
                ) : (
                  <div className="total-value empty">—</div>
                )}
                {sent ? (
                  <span className="gis-week-sent-badge">
                    <Icon name="check" size={10}/> Enviado {sentInfo?.sentAt ? new Date(sentInfo.sentAt).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) : ''}
                  </span>
                ) : hasData && hasPerm(user,'gis','create') ? (
                  <div className="gis-week-action">
                    <button
                      className={`btn btn-sm ${weekPast ? 'btn-danger' : 'btn-primary'}`}
                      onClick={() => sendWeek(wi, week)}
                      title="Marcar esta semana como enviada"
                    >
                      <Icon name="send" size={11}/>
                      {weekPast ? 'Enviar (atrasado)' : 'Enviar semana'}
                    </button>
                  </div>
                ) : null}
              </div>
            </div>
          );
        })}

        {/* Footer */}
        <div className="gis-footer-bar">
          <div className="gis-hint">
            <Icon name="lightbulb" size={13}/>
            <span>Se houver centavos, utilize ponto ou vírgula na digitação do valor.</span>
          </div>
          <div className="gis-month-total">
            <div className="mt-label">Total {MONTH_NAMES[viewMonth]}</div>
            <div className="mt-value">{mt !== null ? fmtBRL(mt) : '—'}</div>
          </div>
        </div>
      </div>

      {/* Admin view: all stores summary */}
      {hasPerm(user,'gis','approve') && (DB.gisVendas||[]).length > 0 && (
        <GISAdminPanel viewYear={viewYear} viewMonth={viewMonth} MONTH_NAMES={MONTH_NAMES}/>
      )}
      </>)}
    </div>
  );
}

/* ── GIS Admin Panel — decrypts all store records ── */
function GISAdminPanel({ viewYear, viewMonth, MONTH_NAMES }) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    (async () => {
      setLoading(true);
      const result = [];
      for (const rec of (DB.gisVendas || [])) {
        try {
          const [store, periodo, dataStr, sentStr] = await Promise.all([
            decryptField(rec.encStore   || rec.store || ''),
            decryptField(rec.encPeriodo || ''),
            decryptField(rec.encData    || '{}'),
            decryptField(rec.encSent    || '{}'),
          ]);
          const data = JSON.parse(dataStr || '{}');
          const sent = JSON.parse(sentStr  || '{}');
          let total = 0; let dias = 0;
          Object.keys(data).forEach(k => {
            const d = new Date(k);
            if (d.getFullYear() === viewYear && d.getMonth() === viewMonth && data[k]?.value !== null && data[k]?.value !== undefined) {
              total += data[k].value || 0; dias++;
            }
          });
          const semanas = Object.keys(sent).filter(k => k.startsWith(`gis_${viewYear}_${String(viewMonth+1).padStart(2,'0')}`)).length;
          result.push({ store, periodo, total, dias, semanas, updatedAt: rec.updatedAt });
        } catch(e) { result.push({ store:'—', periodo:'—', total:0, dias:0, semanas:0, updatedAt: rec.updatedAt }); }
      }
      setRows(result);
      setLoading(false);
    })();
  }, [viewYear, viewMonth]);

  return (
    <div className="card" style={{ marginTop:24 }}>
      <div className="card-head">
        <h3>📊 Resumo Geral — Todas as Lojas ({MONTH_NAMES[viewMonth]}/{viewYear})</h3>
        <span className="status-pill ok"><span className="ind"/>Dados criptografados AES-GCM 256-bit</span>
      </div>
      {loading ? (
        <div style={{ textAlign:'center', padding:24, color:'var(--ink-3)', fontSize:13 }}>
          <Icon name="shield" size={16} style={{ verticalAlign:'middle', marginRight:6 }}/>Descriptografando registros…
        </div>
      ) : (
        <div style={{ overflowX:'auto' }}>
          <table className="users-table">
            <thead>
              <tr><th>Loja / Responsável</th><th>Período</th><th>Dias preenchidos</th><th>Semanas enviadas</th><th>Total do mês</th><th>Última atualização</th></tr>
            </thead>
            <tbody>
              {rows.length === 0 && <tr><td colSpan={6} style={{ textAlign:'center', padding:24, color:'var(--ink-3)' }}>Nenhum registro encontrado.</td></tr>}
              {rows.map((r, i) => (
                <tr key={i}>
                  <td><div style={{ fontWeight:600 }}>{r.store || '—'}</div></td>
                  <td><div style={{ fontSize:12, color:'var(--ink-3)' }}>{r.periodo || '—'}</div></td>
                  <td>{r.dias}</td>
                  <td>{r.semanas}</td>
                  <td><strong style={{ color:'var(--ok)' }}>{r.total > 0 ? fmtBRL(r.total) : '—'}</strong></td>
                  <td style={{ fontSize:11, color:'var(--ink-3)' }}>{r.updatedAt ? new Date(r.updatedAt).toLocaleString('pt-BR') : '—'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════
   ROOT APP
   ════════════════════════════════════════════════════════════════ */
/* ── SEARCH RESULTS ── */
function SearchResults({ query, user, onClear, go }) {
  const q = query.trim().toLowerCase();

  // Comunicados: busca em title, body, categ, tags
  const feedItems = (DB?.feed || [])
    .filter(f => !f.exibicao || f.exibicao !== 'login')
    .filter(f => {
      if (!q) return false;
      return (
        f.title?.toLowerCase().includes(q) ||
        f.body?.toLowerCase().includes(q) ||
        f.categ?.toLowerCase().includes(q) ||
        (f.tags || []).some(t => t.toLowerCase().includes(q)) ||
        f.author?.toLowerCase().includes(q)
      );
    });

  // Solicitações: admin/gestor vê todas, colaborador só as suas
  const canApprove = hasPerm(user, 'servicos', 'approve');
  const allReqs = canApprove ? (DB?.requests || []) : (DB?.requests || []).filter(r => r.createdBy === user.id);
  const reqItems = allReqs.filter(r => {
    if (!q) return false;
    return (
      r.tipo?.toLowerCase().includes(q) ||
      r.desc?.toLowerCase().includes(q) ||
      r.status?.toLowerCase().includes(q) ||
      r.local?.toLowerCase().includes(q) ||
      r.createdByName?.toLowerCase().includes(q)
    );
  });

  const total = feedItems.length + reqItems.length;

  const categColor = (c) => {
    const map = { Geral:'var(--ink-3)', Operacional:'var(--info)', RH:'var(--ok)', 'Segurança':'var(--err)',
      Manutenção:'var(--warn)', Comercial:'var(--gold-2)', TI:'var(--navy)', Evento:'#7c3aed' };
    return map[c] || 'var(--ink-3)';
  };

  const highlight = (text, q) => {
    if (!text || !q) return text;
    const idx = text.toLowerCase().indexOf(q);
    if (idx < 0) return text.length > 120 ? text.slice(0, 120) + '…' : text;
    const start = Math.max(0, idx - 40);
    const end = Math.min(text.length, idx + q.length + 80);
    const pre = (start > 0 ? '…' : '') + text.slice(start, idx);
    const match = text.slice(idx, idx + q.length);
    const post = text.slice(idx + q.length, end) + (end < text.length ? '…' : '');
    return <>{pre}<mark style={{ background:'rgba(201,169,97,0.3)', borderRadius:2, padding:'0 2px' }}>{match}</mark>{post}</>;
  };

  return (
    <div className="main-pad">
      <div className="page-title-row">
        <div className="page-title">
          <h2>Busca: "{query}"</h2>
          <p>{total} resultado{total !== 1 ? 's' : ''} encontrado{total !== 1 ? 's' : ''}</p>
        </div>
        <button className="btn btn-ghost" onClick={onClear}>
          <Icon name="x" size={13}/> Limpar busca
        </button>
      </div>

      {total === 0 && (
        <div className="card" style={{ textAlign:'center', padding:48 }}>
          <Icon name="search" size={36} style={{ color:'var(--ink-4)', display:'block', margin:'0 auto 12px' }}/>
          <div style={{ fontWeight:600, color:'var(--ink-2)', marginBottom:6 }}>Nenhum resultado encontrado.</div>
          <div style={{ fontSize:13, color:'var(--ink-3)' }}>Tente outros termos ou verifique a ortografia.</div>
        </div>
      )}

      {feedItems.length > 0 && (
        <>
          <div style={{ fontSize:11, fontWeight:700, color:'var(--ink-3)', letterSpacing:'.1em', textTransform:'uppercase', marginBottom:10, display:'flex', alignItems:'center', gap:8 }}>
            <Icon name="megaphone" size={13}/> Comunicados ({feedItems.length})
            <button className="btn btn-ghost btn-sm" style={{ marginLeft:'auto', fontSize:11 }} onClick={() => { onClear(); go('feed'); }}>Ver todos</button>
          </div>
          {feedItems.map(it => (
            <div className="feed-card" key={it.id} style={{ borderLeft: it.fixado ? '4px solid var(--gold)' : undefined }}>
              <div className="feed-head">
                <div className="av">{(it.author||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()}</div>
                <div>
                  <div className="who">{it.author}</div>
                  <div className="when">{it.role} · {relativeTime(it.when)}</div>
                </div>
                <span style={{ marginLeft:'auto', fontSize:11, fontWeight:700, color:'white', background:categColor(it.categ), padding:'3px 9px', borderRadius:999 }}>{it.categ||'Geral'}</span>
              </div>
              <h4>{highlight(it.title, q)}</h4>
              <p className="body">{highlight(it.body, q)}</p>
              {it.tags && it.tags.length > 0 && (
                <div className="feed-tags">{it.tags.map(t=><span key={t}>#{t}</span>)}</div>
              )}
            </div>
          ))}
        </>
      )}

      {reqItems.length > 0 && (
        <>
          <div style={{ fontSize:11, fontWeight:700, color:'var(--ink-3)', letterSpacing:'.1em', textTransform:'uppercase', marginBottom:10, marginTop: feedItems.length > 0 ? 24 : 0, display:'flex', alignItems:'center', gap:8 }}>
            <Icon name="list" size={13}/> Solicitações ({reqItems.length})
            <button className="btn btn-ghost btn-sm" style={{ marginLeft:'auto', fontSize:11 }} onClick={() => { onClear(); go('mine'); }}>Ver todas</button>
          </div>
          {reqItems.map(r => (
            <div className="card" key={r.id} style={{ marginBottom:10, padding:'14px 18px' }}>
              <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:6 }}>
                <span style={{ fontSize:12, fontWeight:700, color:'white', background: r.status==='Concluído'?'var(--ok)': r.status==='Cancelado'?'var(--err)': r.status==='Em andamento'?'var(--info)':'var(--warn)', padding:'3px 10px', borderRadius:999 }}>{r.status}</span>
                <span style={{ fontSize:13, fontWeight:600, color:'var(--ink)' }}>{highlight(r.tipo, q)}</span>
                <span style={{ marginLeft:'auto', fontSize:11, color:'var(--ink-3)' }}>#{r.id?.slice(-6)}</span>
              </div>
              {r.desc && <p style={{ fontSize:13, color:'var(--ink-2)', margin:0, lineHeight:1.5 }}>{highlight(r.desc, q)}</p>}
              {r.local && <div style={{ fontSize:12, color:'var(--ink-3)', marginTop:4 }}>📍 {highlight(r.local, q)}</div>}
              {r.createdByName && <div style={{ fontSize:11, color:'var(--ink-4)', marginTop:4 }}>Solicitante: {highlight(r.createdByName, q)} · {relativeTime(r.createdAt)}</div>}
            </div>
          ))}
        </>
      )}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('home');
  const [authed, setAuthed] = useState(false);
  const [user, setUser] = useState(null);
  const [dbReady, setDbReady] = useState(false);
  const [isFirstAccess, setIsFirstAccess] = useState(false);
  const [tempAdminPwd, setTempAdminPwd] = useState(null);
  const [syncMsg, setSyncMsg] = useState('Inicializando...');
  const [syncTone, setSyncTone] = useState('muted');
  const [, force] = useState(0);
  const refresh = () => force(x => x + 1);
  const [ghOpen, setGhOpen] = useState(false);
  const [forceChangePwd, setForceChangePwd] = useState(false);
  const [searchQuery, setSearchQuery] = useState('');
  const sessionTimer = useRef(null);
  const [isMobile, setIsMobile] = useState(window.innerWidth < 768);

  useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);

  /* Timeout de sessão: 8 horas de inatividade */
  const SESSION_TIMEOUT = 8 * 60 * 60 * 1000;
  const resetSessionTimer = () => {
    if (sessionTimer.current) clearTimeout(sessionTimer.current);
    sessionTimer.current = setTimeout(() => {
      setUser(null); setAuthed(false); setScreen('home');
    }, SESSION_TIMEOUT);
  };
  useEffect(() => {
    if (authed) {
      resetSessionTimer();
      const events = ['click','keydown','mousemove','touchstart'];
      events.forEach(e => window.addEventListener(e, resetSessionTimer, { passive:true }));
      return () => {
        events.forEach(e => window.removeEventListener(e, resetSessionTimer));
        if (sessionTimer.current) clearTimeout(sessionTimer.current);
      };
    }
  }, [authed]);

  useEffect(() => {
    initDB((m,t) => { setSyncMsg(m); setSyncTone(t); }).then(() => {
      /* Verifica se é primeiro acesso (só um user admin com forcePasswordChange) */
      const u = DB?.users;
      if (u && u.length === 1 && u[0].forcePasswordChange && window.__TEMP_ADMIN_PWD__) {
        setTempAdminPwd(window.__TEMP_ADMIN_PWD__);
        delete window.__TEMP_ADMIN_PWD__;
        setIsFirstAccess(true);
      }
      setDbReady(true);
    });
  }, []);

  const go = (s) => setScreen(s);

  const handleLogin = async (login, password) => {
    const result = await findUserByLogin(login, password);
    /* Bloqueio por força bruta */
    if (result && result.__blocked) return result;
    if (!result) return null;
    setUser(result); setAuthed(true); setScreen('home');
    if (result.forcePasswordChange) setForceChangePwd(true);
    return true;
  };

  const handleLogout = () => {
    setUser(null); setAuthed(false); setScreen('home');
    if (sessionTimer.current) clearTimeout(sessionTimer.current);
  };

  const handleNewRequest = async (payload) => {
    await addRequest(payload, user);
    await persistDB((m,t) => { setSyncMsg(m); setSyncTone(t); });
    refresh(); go('mine');
  };

  const handleConfigSave = async (cfg) => {
    GH.saveCfg(cfg);
    setSyncMsg('Testando...'); setSyncTone('loading');
    const t = await GH.test();
    if (t.ok) {
      setSyncMsg('Sincronizando...'); setSyncTone('loading');
      await persistDB((m,tone) => { setSyncMsg(m); setSyncTone(tone); });
      return { ok:true };
    }
    setSyncMsg(t.msg); setSyncTone('warn');
    return { ok:false, msg:t.msg };
  };

  if (!dbReady) {
    return <div className="app-shell" style={{ alignItems:'center', justifyContent:'center', display:'flex' }}>
      <div style={{ textAlign:'center' }}>
        <div className="skel" style={{ width:120, height:120, borderRadius:24, margin:'0 auto 16px' }}/>
        <div style={{ fontSize:13, color:'var(--ink-3)' }}>{syncMsg}</div>
      </div>
    </div>;
  }

  /* Primeiro acesso — tela de configuração da senha do admin */
  if (isFirstAccess) {
    return <SetupScreen tempPwd={tempAdminPwd} onDone={() => { setIsFirstAccess(false); setTempAdminPwd(null); }}/>;
  }

  if (!authed) {
    return <LoginScreen onLogin={handleLogin} ghOpen={ghOpen} setGhOpen={setGhOpen} onConfigSave={handleConfigSave}/>;
  }

  return (
    <div className={`app-shell${isMobile ? ' mobile' : ''}`}>
      {forceChangePwd && <ForcePasswordModal user={user} onDone={() => { setForceChangePwd(false); saveDBLocal(DB); }}/>}
      <TopBar user={user} syncMsg={syncMsg} syncTone={syncTone} onConfig={() => setGhOpen(true)} onLogout={handleLogout} searchQuery={searchQuery} onSearch={q => { setSearchQuery(q); }}/>
      <div className="layout-row">
        {!isMobile && <Sidebar active={screen} onNav={go} user={user}/>}
        <div className="main">
          {searchQuery.trim() ? (
            <SearchResults query={searchQuery} user={user} onClear={() => setSearchQuery('')} go={go}/>
          ) : (
            <>
          {screen==='home'        && <Dashboard go={go} mobile={isMobile} user={user}/>}
          {screen==='feed'        && <Feed mobile={isMobile} user={user} onPersist={() => persistDB((m,t) => { setSyncMsg(m); setSyncTone(t); })}/>}
          {screen==='newreq'      && hasPerm(user,'servicos','create')  && <NewRequest go={go} mobile={isMobile} onSubmit={handleNewRequest} user={user}/>}
          {screen==='newreq'      && !hasPerm(user,'servicos','create') && <Blocked/>}
          {screen==='mine'        && <MyRequests go={go} mobile={isMobile} user={user} onChange={refresh} onPersist={() => persistDB((m,t) => { setSyncMsg(m); setSyncTone(t); })}/>}
          {screen==='usuarios'    && <UsersScreen user={user} onPersist={() => persistDB((m,t) => { setSyncMsg(m); setSyncTone(t); })} onChange={refresh}/>}
          {screen==='vagas'       && <CadastrarVagaScreen user={user} onPersist={() => persistDB((m,t) => { setSyncMsg(m); setSyncTone(t); })} onChange={refresh}/>}
          {screen==='curriculos'  && <ConsultarCurriculosScreen user={user}/>}
          {screen==='vagas-lista' && <ConsultarVagasScreen user={user} onNav={go}/>}
          {screen==='candidatar'  && <CandidatarVagaScreen user={user} onPersist={() => persistDB((m,t) => { setSyncMsg(m); setSyncTone(t); })} onChange={refresh}/>}
          {screen==='mini-comunicado' && hasPerm(user,'feed','create') && <MiniComunicadoScreen user={user} onPersist={() => persistDB((m,t) => { setSyncMsg(m); setSyncTone(t); })} onChange={refresh}/>}
          {screen==='mini-comunicado' && !hasPerm(user,'feed','create') && <Blocked/>}
          {screen==='gis'             && hasPerm(user,'gis','view')     && <GISScreen user={user} onPersist={() => persistDB((m,t) => { setSyncMsg(m); setSyncTone(t); })} onChange={refresh}/>}
          {screen==='gis'             && !hasPerm(user,'gis','view')    && <Blocked/>}
          {screen==='gis-admin'       && hasPerm(user,'gis','approve')  && <GISAdminScreen user={user} onPersist={() => persistDB((m,t) => { setSyncMsg(m); setSyncTone(t); })} onChange={refresh}/>}
          {screen==='gis-admin'       && !hasPerm(user,'gis','approve') && <Blocked/>}
            </>
          )}
          {isMobile && <BottomTabs active={screen} onNav={go} user={user}/>}
        </div>
      </div>
      {ghOpen && <GitHubConfigModal onClose={() => setGhOpen(false)} onSave={handleConfigSave}/>}
    </div>
  );
}

function Blocked() {
  return <div className="main-pad"><div className="card" style={{ textAlign:'center', padding:40, color:'var(--ink-3)' }}>
    <Icon name="shield" size={32} style={{ margin:'0 auto 12px', display:'block' }}/>
    <p>Você não tem permissão para acessar este módulo.</p>
  </div></div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
